name: Dealerware Partner Integration API — Webhook Surface
note: >-
  Silvercar's technology now operates as Dealerware; the event/webhook surface
  is documented at developer.dealerware.com. No AsyncAPI document is published
  (the API is REST + webhooks over a ReadMe developer hub), so this captures the
  documented webhook catalog rather than a verbatim AsyncAPI spec.
patterns:
- direction: outbound
  name: Outbound Webhooks
  description: >-
    Event-based updates delivered from Dealerware to a partner's registered
    endpoint(s) for asynchronous, event-driven integration (e.g. reservation,
    vehicle, and fleet state changes surfaced via the REST resources).
- direction: inbound
  name: Inbound Webhooks
  description: >-
    System-to-system messages sent to Dealerware and verified using HMAC for
    payload integrity.
  security: HMAC payload signature verification
