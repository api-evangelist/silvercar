aid: silvercar

name: silvercar

description: Silvercar began as an Austin, Texas premium car-rental startup (all-silver Audi fleet) and was a Slow Ventures portfolio company.
  After Audi acquired it, the team pivoted the technology into Dealerware, a dealership fleet-management and courtesy/loaner-mobility SaaS platform.
  silvercar.com now 301-redirects to dealerware.com, and the company's public developer surface is the Dealerware Partner Integration API — a
  versioned (v4) REST API on a ReadMe developer hub at developer.dealerware.com covering contracts, reservations, customers, dealerships, fleets,
  vehicles, drivers, employees, payments, reporting, and webhooks. Authentication is OAuth 2.0 machine-to-machine (client_credentials) via Auth0,
  returning RS256-signed JWT bearer tokens.

