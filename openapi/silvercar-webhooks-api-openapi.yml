- Auth0: []
tags:
- name: Webhooks
  description: Dealership webhook actions and resources
paths:
  /admin/dealerships/{dealership_id}/webhooks:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a paginated list of dealership webhooks
      operationId: getAdminDealershipWebhooks
      tags:
      - Webhooks
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: The page number to fetch, defaulting to 1.
        schema:
          type: integer
          example: 1
      - name: per_page
        in: query
        required: false
        description: The number of webhook records to return, defaulting to 30.
        schema:
          type: integer
          example: 30
      responses:
        '200':
          description: Success
          headers:
            page:
              schema:
                type: integer
                example: 1
            per-page:
              schema:
                type: integer
                example: 30
            total:
              schema:
                type: integer
                example: 2
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    post:
      summary: Creates a new webhook for a dealership
      operationId: postAdminDealershipWebhook
      tags:
      - Webhooks
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDealershipWebhookCreateRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDealershipWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{dealership_id}/webhooks/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a dealership webhook
      operationId: getAdminDealershipWebhook
      tags:
      - Webhooks
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the webhook
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDealershipWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Updates a dealership webhook
      operationId: putAdminDealershipWebhook
      tags:
      - Webhooks
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the webhook
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDealershipWebhookUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDealershipWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Deletes a dealership webhook
      operationId: deleteAdminDealershipWebhook
      tags:
      - Webhooks
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the webhook
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
