openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Employees API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Employees
  description: Employee actions and resources
paths:
  /admin/dealerships/{dealership_id}/employees/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns an employee's profile details
      operationId: getEmployee
      tags:
      - Employees
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: the dealership ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: the employee ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEmployeeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Update an Employee's details
      operationId: putEmployee
      tags:
      - Employees
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: the dealership ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: The id of the employee
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminEmployeeRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{dealership_id}/employees/{id}/activations:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    delete:
      summary: Deactivate an Employee
      operationId: deleteEmployeeActivation
      tags:
      - Employees
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the employee
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: the dealership ID
        schema:
          type: integer
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      summary: Activate an Employee
      operationId: postEmployeeActivation
      tags:
      - Employees
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the employee
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: the dealership ID
        schema:
          type: integer
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{dealership_id}/employees/{id}/roles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns an employee's roles for a dealership
      description: 'Returns effective employee roles for the dealership. HopDrive roles are returned only for capabilities supported by the dealership''s effective HopDrive valet_type set: manage_valet_moves requires valet or third_party_labor, and manage_guest_rides requires guest_rides.'
      operationId: getDealershipEmployeeRoles
      tags:
      - Employees
      parameters:
      - name: id
        in: path
        required: true
        description: the employee ID
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: the dealership ID
        schema:
          type: integer
      - $ref: '#/components/parameters/PageQueryParameter'
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 30
        description: Number of items per page
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserDealershipRolesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Update an employee's roles for a dealership
      description: 'Updates employee roles for the dealership. HopDrive role assignments are accepted only when supported by the dealership''s effective HopDrive valet_type set: manage_valet_moves requires valet or third_party_labor, and manage_guest_rides requires guest_rides. Existing unsupported HopDrive roles can still be removed.'
      operationId: putDealershipEmployeeRoles
      tags:
      - Employees
      parameters:
      - name: id
        in: path
        required: true
        description: the employee ID
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: the dealership ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UpdateAdminEmployeeRolesRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{id}/employees:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns the list of Employees associated with a dealership
      operationId: getAdminDealershipEmployees
      tags:
      - Employees
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: sort
        in: query
        description: The sort order for each sort field MUST be ascending unless it is prefixed with a minus (U+002D HYPHEN-MINUS, "-"), in which case it MUST be descending.
        required: false
        schema:
          $ref: '#/components/schemas/AdminEmployeeSortColumns'
      - name: active
        in: query
        description: Filter employees to those that are either active or inactive
        required: false
        schema:
          type: boolean
      - name: role
        in: query
        description: Filter employees who have a specific role
        required: false
        schema:
          type: string
          example: driver,admin
      - $ref: '#/components/parameters/PageQueryParameter'
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 30
        description: Number of items per page
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEmployeeResponse'
            text/csv:
              schema:
                type: string
              examples:
                csv table:
                  value: 'first_name, last_name, email, phone_number, active, confirmed

                    Dana, Scully, dana.scully@fbi.gov, 8002255324, true, true

                    '
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    post:
      summary: Create a new employee associated with a dealership
      operationId: postAdminDealershipEmployee
      tags:
      - Employees
      parameters:
      - name: id
        in: path
        required: true
        description: the dealership ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminEmployeeRequest'
      responses:
        '201':
          description: Success
          headers:
            Location:
              schema:
                type: string
                description: Link location of created employee
                example: https://api.dw-tst.com/dealerships/42/employees/99
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{id}/employees/search:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns the list of Employees associated with a dealership based on search query
      operationId: getAdminDealershipEmployeesSearch
      tags:
      - Employees
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: q
        in: query
        required: true
        description: Query parameter to search against indexed fields on dealership employees
        schema:
          type: string
      - name: role
        in: query
        required: false
        description: Filter employees who have a specific role
        schema:
          type: string
          example: driver,admin
      - $ref: '#/components/parameters/PageQueryParameter'
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 30
        description: Number of items per page
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEmployeeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
components:
  schemas:
    AdminEmployeeSortColumns:
      type: string
      enum:
      - confirmed
      - email
      - first_name
    UpdateAdminEmployeeRolesRequest:
      type: object
      properties:
        id:
          type: integer
          description: id of the role to be made active for the employee
          example: 42
    AdminUserDealershipRolesResponse:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: location_manager
    CreateAdminEmployeeRequest:
      type: object
      required:
      - first_name
      - last_name
      - email
      properties:
        first_name:
          type: string
          example: Dana
        last_name:
          type: string
          example: Scully
        email:
          type: string
          example: dana.scully@fbi.gov
        phone_number:
          type: string
          example: '8002255324'
    AdminEmployeeResponse:
      type: object
      required:
      - id
      - email
      - confirmed
      - active
      - first_name
      - last_name
      - phone_number
      - session_replays_enabled_until
      - roles
      - is_driver
      properties:
        id:
          type: integer
          example: 42
        email:
          type: string
          example: dana.scully@fbi.gov
        confirmed:
          type: boolean
          example: false
        active:
          type: boolean
          example: true
        first_name:
          type: string
          example: Dana
        last_name:
          type: string
          example: Scully
        phone_number:
          type: string
          example: '8002255324'
        session_replays_enabled_until:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-04-10T18:30:00Z'
          description: When Datadog session replay enforcement expires for the user
        is_driver:
          type: boolean
          example: false
        roles:
          type: array
          items:
            type: object
            required:
            - id
            - name
            properties:
              id:
                type: number
                example: 1
                description: the ID of the Role
              name:
                type: string
                example: driver
                description: the NAME of the Role
          example:
          - id: 1
            name: admin
          - id: 2
            name: driver
    UpdateAdminEmployeeRequest:
      type: object
      properties:
        first_name:
          type: string
          example: Dana
        last_name:
          type: string
          example: Scully
        phone_number:
          type: string
          example: '8002255324'
  responses:
    NoContent:
      description: No Content
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Accepted media types is limited to JSON (application/json)
              code:
                type: integer
                example: 6789
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid authorization token
              code:
                type: integer
                example: 6789
    Created:
      description: Created
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The request has been fulfilled and has resulted in a new resource being created
    UnprocessableEntity:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid resource id
              code:
                type: integer
                example: 6789
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource with id :id not found
              code:
                type: integer
                example: 6789
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Bad Request
              code:
                type: integer
                example: 6789
    NotAcceptable:
      description: Not Acceptable
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Missing headers in request
              code:
                type: integer
                example: 6789
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Request is forbidden
              code:
                type: integer
                example: 6789
  parameters:
    PageQueryParameter:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
      description: Page number to fetch
  securitySchemes:
    Auth0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://dealerware.auth0.com/oauth/token
          scopes: {}
