openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Fleets API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Fleets
  description: Fleet actions and resources
paths:
  /admin/dealerships/{dealership_id}/fleets/trim_types_in_fleets:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      tags:
      - Fleets
      summary: Returns a given dealerships vehicle trims for all her fleets
      operationId: getDealershipTrimTypesInFleets
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: the dealership ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDealershipFleetsTrimTypesInFleetRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/dealerships/{id}/fleets/contracts_vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Fetch the fleets for a location, along with the contracts (within the given…
      operationId: getAdminDealershipFleetsContractsAndVehicles
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the range to fetch contracts for (inclusive)
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T00:00:00Z'
      - name: end_at
        description: The timestamp for the end of the range to fetch contracts for (inclusive)
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-21T00:00:00Z'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/AdminDealershipFleetsContractsVehiclesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/dealerships/{id}/vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Creates a new Vehicle for a Dealership and assigns it to a list of Fleets
      operationId: postDealershipVehicle
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehicleRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/fleets/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Gets a fleet
      operationId: getFleet
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/AdminFleetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Updates a fleet
      operationId: putFleet
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminFleetRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/AdminFleetResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: 'Deletes a fleet. NOTE: Temporarily Disabled. See SC-5730'
      operationId: deleteFleet
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      responses:
        '204':
          description: success
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/fleets/{id}/availability:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get active fleet size and required vehicles needed within a time range
      operationId: getFleetAvailability
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/AdminAvailabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/fleets/{id}/availability/intervals:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability by 30-minute interval for every interval between start and…
      operationId: getFleetAvailabilityIntervals
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: exclude_contract_id
        description: If provided, the contract associated with the ID will be excluded from availability calculations. This is used for "modify" contract calculations
        in: query
        required: false
        schema:
          type: number
          example: 12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminFleetAvailabilityIntervalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/fleets/{id}/availability/intervals/continuous:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability from a static time by 30-minute interval for every interval…
      operationId: getFleetAvailabilityIntervalsContinuous
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      - name: reservation_start_at
        description: The timestamp for the start of reservation, which availability is calculated from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: exclude_contract_id
        description: If provided, the contract associated with the ID will be excluded from availability calculations. This is used for "modify" contract calculations
        in: query
        required: false
        schema:
          type: number
          example: 12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminFleetAvailabilityIntervalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/fleets/{id}/availability/intervals/continuous/daily:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability from a static time by day for every day between start and end…
      operationId: getFleetAvailabilityIntervalsContinuousDaily
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      - name: reservation_start_at
        description: The timestamp for the start of reservation, which availability is calculated from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T00:00:00Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-21T00:00:00Z'
      - name: exclude_contract_id
        description: If provided, the contract associated with the ID will be excluded from availability calculations. This is used for "modify" contract calculations
        in: query
        required: false
        schema:
          type: number
          example: 12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminFleetAvailabilityIntervalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/fleets/{id}/availabiliy/intervals/daily:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability by day for every day between start and end, inclusive
      operationId: getFleetAvailabilityIntervalsDaily
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T00:00:00Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-21T00:00:00Z'
      - name: exclude_contract_id
        description: If provided, the contract associated with the ID will be excluded from availability calculations. This is used for "modify" contract calculations
        in: query
        required: false
        schema:
          type: number
          example: 12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminFleetAvailabilityIntervalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/fleets/{id}/contracts:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Creates a new Contract associated with a Fleet
      operationId: postFleetContract
      tags:
      - Fleets
      parameters:
      - name: platform
        in: header
        required: false
        description: Header to let us know platform contract was booked on
        schema:
          type: string
      - name: app_name
        in: header
        required: false
        description: Header to let us know name of application
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminFleetContractRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreatedWithLocationHeader'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/fleets/{id}/vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Creates a new Vehicle associated with a Fleet
      operationId: postFleetVehicles
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehicleRequest-2'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/vehicles/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    put:
      summary: Updates a Vehicle's Fleets
      operationId: putVehicleFleets
      tags:
      - Fleets
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vehicle
        schema:
          type: integer
      requestBody:
        required: true
        description: Either `fleet_id` or `fleet_ids` must be present in the request body. If both are present, `fleet_ids` will be used.
        content:
          application/json:
            schema:
              type: object
              properties:
                fleet_id:
                  type: integer
                fleet_ids:
                  type: array
                  items:
                    type: integer
            example:
              fleet_ids:
              - 12
              - 34
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    AdminFleetRequest:
      type: object
      properties:
        name:
          type: string
          example: Loaner
        agreement_id:
          type:
          - number
          - 'null'
          example: 5
          description: Omit or pass null to keep the current agreement; pass an ID to assign one
        program_type:
          type: string
          example: rental
          description: A string representing the type of program the fleet is in (courtesy, rental, etc)
        require_insurance_sufficiency:
          type: string
          enum:
          - none
          - loaner
          - rental
          - loaner_rental
          example: loaner_rental
          description: Specifies when insurance sufficiency checks are required (none, loaner, rental, or loaner_rental)
    AdminFleetAvailabilityIntervalResponse:
      type: object
      required:
      - start_at
      - end_at
      - fleet_id
      - available
      - active_vehicle_count
      - required_vehicle_count
      properties:
        start_at:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
          description: The beginning of the interval
        end_at:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
          description: The beginning of the interval
        fleet_id:
          type: number
          example: 123
          description: The id for this fleet
        available:
          type: boolean
          description: True if there is availability for this interval, false otherwise
        active_vehicle_count:
          type: integer
          example: 30
          description: The count of active vehicles in a fleet
        required_vehicle_count:
          type: integer
          example: 10
          description: The count of minimum vehicles required to service all bookings within a time range
    AdminAvailabilityResponse:
      type: object
      properties:
        active_vehicle_count:
          type: integer
          example: 30
          description: The count of active vehicles in a fleet
        required_vehicle_count:
          type: integer
          example: 10
          description: The count of minimum vehicles required to service all bookings within a time range
    AdminDealershipFleetsTrimTypesInFleetRequest:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            example: Fleet 1
          fleet_id:
            type: integer
            example: 104
          trims:
            type:
            - array
            - 'null'
            items:
              type: object
              properties:
                trim_id:
                  type: integer
                  example: 1
                make:
                  type:
                  - string
                  - 'null'
                  example: Ford
                model:
                  type:
                  - string
                  - 'null'
                  example: F-150
                count:
                  type:
                  - string
                  - 'null'
                  example: 104
    AdminDealershipFleetsContractsVehiclesResponse:
      type: object
      properties:
        vehicle_groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: number
                example: 1
                description: ID of the vehicle group
              contracts:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                      example: 1
                      description: ID of the contract
                    status:
                      type: string
                      example: pending
                      description: the status of the contract
                    vehicle_id:
                      type:
                      - number
                      - 'null'
                      example: 1
                      description: the ID of the vehicle associated with this contract, null if no vehicle is yet assigned
                    customer:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 1
                          description: the ID of the customer associated with this reservation
                        full_name:
                          type: string
                          example: Frodo Baggins
                          description: the full name of the customer associated with this reservation
                    scheduled_pickup_at:
                      type: string
                      format: date-time
                      example: '2022-05-19T16:22:26Z'
                    scheduled_dropoff_at:
                      type: string
                      format: date-time
                      example: '2022-08-10T14:15:30Z'
                    actual_pickup_at:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      example: '2022-05-19T16:22:26Z'
                    actual_dropoff_at:
                      type:
                      - string
                      - 'null'
                      format: date-time
                      example: '2022-08-10T14:15:30Z'
              vehicles:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                      example: 1
                      description: the ID of the vehicle
                    trim:
                      type: object
                      properties:
                        make:
                          type: string
                          example: Toyota
                        model:
                          type: string
                          example: Corolla
                        power_train:
                          type: string
                          example: mechanical
                        year:
                          type: number
                          example: 1999
    AdminVehicleRequest:
      type: object
      required:
      - available_on
      - fleet_ids
      - license
      - license_subregion
      - stock_number
      - vin
      properties:
        available_on:
          type: string
          format: date
          example: '2020-01-01'
        color:
          type: string
          example: grey
        fleet_ids:
          type: array
          items:
            type: integer
          example:
          - 12
          - 42
        license:
          type: string
          example: ABC123
          description: Required vehicle plate. Trimmed and converted to ASCII uppercase before validation. The result must contain 1–8 ASCII letters, digits, spaces, or hyphens, with single spaces or hyphens allowed only between groups of letters or digits. Separators count toward the length. Invalid characters are rejected; format acceptance does not guarantee Bestpass registration. For example, padded lowercase ab-123 becomes AB-123; AB--123 and ABCD-1234 are invalid.
        license_subregion:
          type: string
          example: TX
        stock_number:
          type: string
          example: VV111
        vin:
          type: string
          pattern: '[A-HJ-NPR-Z0-9]{17}'
          example: 1FT7W2BT4DEB5192
        defleet_vehicles:
          type: boolean
          example: true
    AdminFleetResponse:
      type: object
      required:
      - id
      - name
      - agreement_id
      - created_at
      - contractable
      - external_availability_group
      - repair_order_number_required
      - exclude_rate
      - pdf_agreement_url
      - program_type
      - source_of_business
      - reservation_time_cap
      - reservation_time_cap_warning
      - allow_charge_later
      - allow_manual_signature
      - require_customer_vin
      - guided_walkaround_enforced
      - require_insurance_sufficiency
      - misc
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: Loaner
        agreement_id:
          type:
          - integer
          - 'null'
          example: 5
