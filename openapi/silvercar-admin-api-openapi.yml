openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Admin API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Admin
  description: Administrative actions and resources
paths:
  /admin/contracts/{id}/contactless/messages:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Creates a contactless text message associated with a contract
      operationId: postContractContactlessMessages
      tags:
      - Admin
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the contract
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminContactlessMessagesRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/contracts/{id}/rental_agreements:
    parameters:
    - $ref: '#/components/parameters/0'
    get:
      summary: Get the rental agreement PDF for a reservation
      operationId: getRentalAgreementPDF
      tags:
      - Admin
      parameters:
      - name: id
        description: reservation_id used to scope rental agreement
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Rental agreement PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: An invalid request has been detected
          $ref: '#/components/responses/BadRequest'
        '401':
          description: User authentication has failed
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User is not authorized to view this resource
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested resource was not found
          $ref: '#/components/responses/NotFound'
  /admin/customer_notifications/failed:
    get:
      summary: Lists failed customer notifications eligible for replay
      description: Available to god users only.
      operationId: getAdminCustomerNotificationsFailed
      tags:
      - Admin
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
        description: Maximum number of failed customer notifications to return.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FailedCustomerNotification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/customer_notifications/{notification_id}/replay:
    post:
      summary: Replays a failed customer notification
      description: Available to god users only.
      operationId: postAdminCustomerNotificationReplay
      tags:
      - Admin
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
        description: Customer notification ID to replay.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayCustomerNotificationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayCustomerNotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/login:
    post:
      summary: Admin login endpoint
      operationId: postLogin
      tags:
      - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
components:
  schemas:
    FailedCustomerNotification:
      type: object
      properties:
        id:
          type: integer
          example: 123
        reservation_id:
          type:
          - integer
          - 'null'
          example: 456
        customer_id:
          type:
          - integer
          - 'null'
          example: 789
        location_id:
          type:
          - integer
          - 'null'
          example: 321
        message_type:
          type: string
          example: starting_notification
        channel:
          type: string
          example: sms
        provider:
          type: string
          example: partner_mykaarma
        status:
          type: string
          example: delivery_failed
        attempt_count:
          type: integer
          example: 1
        replay_count:
          type: integer
          example: 0
        last_error_code:
          type:
          - string
          - 'null'
          example: partner_mykaarma_provider_rejected
        last_error_message:
          type:
          - string
          - 'null'
          example: Provider rejected notification
        last_failed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        latest_attempt:
          $ref: '#/components/schemas/CustomerNotificationAttempt'
    ReplayCustomerNotificationRequest:
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
          example: Retry after provider outage
    AdminLoginRequest:
      properties:
        email:
          type: string
          example: joetoe123@email.com
        password:
          type: string
          minLength: 8
          pattern: (?=.*\d)(?=.*[a-z])(?=.*[A-Z])
          example: One234567
    AdminContactlessMessagesRequest:
      properties:
        fuel_percentage:
          type: number
          format: double
          example: 94.6
        odometer:
          type: object
          required:
          - value
          - unit
          properties:
            value:
              type: number
              format: float
              example: 20055.12
            unit:
              type: string
              example: km
    CustomerNotificationAttempt:
      type:
      - object
      - 'null'
      properties:
        id:
          type: integer
          example: 987
        attempt_number:
          type: integer
          example: 2
        provider:
          type: string
          example: partner_mykaarma
        status:
          type: string
          example: provider_rejected
        provider_message_id:
          type:
          - string
          - 'null'
          example: message-uuid
        error_code:
          type:
          - string
          - 'null'
          example: partner_mykaarma_provider_rejected
        error_message:
          type:
          - string
          - 'null'
          example: Provider rejected notification
        requested_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        callback_received_at:
          type:
          - string
          - 'null'
          format: date-time
    AdminLoginResponse:
      properties:
        auth_token:
          type: string
          example: 1234abcd
    ReplayCustomerNotificationResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        notification_id:
          type: integer
          example: 123
        notification_attempt_id:
          type: integer
          example: 987
        attempt_number:
          type: integer
          example: 2
        replay_requested_at:
          type: string
          format: date-time
  responses:
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Accepted media types is limited to JSON (application/json)
              code:
                type: integer
                example: 6789
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Bad Request
              code:
                type: integer
                example: 6789
    UnprocessableEntity:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid resource id
              code:
                type: integer
                example: 6789
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource with id :id not found
              code:
                type: integer
                example: 6789
    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The request has been accepted for processing
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid authorization token
              code:
                type: integer
                example: 6789
    NotAcceptable:
      description: Not Acceptable
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Missing headers in request
              code:
                type: integer
                example: 6789
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Request is forbidden
              code:
                type: integer
                example: 6789
  parameters:
    '0':
      name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
  securitySchemes:
    Auth0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://dealerware.auth0.com/oauth/token
          scopes: {}
