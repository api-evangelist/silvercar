openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Availability 2.0 API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Availability 2.0
  description: Version 2 of Availability which supports vehicle grouping and schedulers
paths:
  /admin/availability/groups/{group_id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability for a Fleet/Program
      operationId: getProgramAvailability
      tags:
      - Availability 2.0
      parameters:
      - name: group_id
        in: path
        required: true
        description: The id of the Fleet/Program
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: include_estimates
        description: Whether to include billing estimates for each make and model. Does not work with time_slot_interval.
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: ignore_reservation_ids
        description: Comma-separated list of reservation IDs to ignore when calculating availability. Useful for modifying existing reservations.
        in: query
        required: false
        schema:
          type: string
          example: 123,234
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAvailabilityGroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/availability/groups/{group_id}/intervals:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability for a Fleet/Program with intervals
      operationId: getProgramAvailabilityIntervals
      tags:
      - Availability 2.0
      parameters:
      - name: group_id
        in: path
        required: true
        description: The id of the Fleet/Program
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: time_slot_interval
        description: Format response in intervals. 5-minute increments from 15 to 55 minutes, or 1 hour.
        in: query
        required: true
        schema:
          type: string
          enum:
          - 15minutes
          - 20minutes
          - 25minutes
          - 30minutes
          - 35minutes
          - 40minutes
          - 45minutes
          - 50minutes
          - 55minutes
          - 1hour
      - name: ignore_reservation_ids
        description: Comma-separated list of reservation IDs to ignore when calculating availability. Useful for modifying existing reservations.
        in: query
        required: false
        schema:
          type: string
          example: 123,234
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAvailabilityGroupIntervalsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    AdminAvailabilityVehicles:
      type: object
      properties:
        id:
          type: integer
          description: Origin vehicle id
          example: 42
        vin:
          type: string
          description: Vehicle VIN
          example: 1G1YY22G8X5123456
        base_msrp:
          type: string
          description: Base MSRP
          example: $28,760.00
    AdminAvailabilityGroupResponse:
      type: object
      properties:
        id:
          type: integer
          description: Origin group id
          example: 42
        name:
          type: string
          description: Group name generated from model description, or existing group name
          example: 2 Door Coupe/Convertible Roadster
        available_vehicle_count:
          type: number
          description: Number of available vehicles in the group
          example: 1
        total_vehicle_count:
          type: number
          description: Number of total vehicles in the group
          example: 2
        make:
          type: string
          description: Vehicle make for the group
          example: GMC
        model:
          type: string
          description: Vehicle model for the group
          example: Sierra 1500
        trim:
          type: string
          description: Vehicle trim for the group
          example: Elevation
        body_type:
          type: string
          description: Vehicle body type for the group
          example: Crew Cab
        power_train:
          type: string
          description: Vehicle power train for the group
          example: mechanical
        available_vehicles:
          type: array
          items:
            $ref: '#/components/schemas/AdminAvailabilityVehicles'
        estimate:
          $ref: '#/components/schemas/BillingEstimate'
    AdminAvailabilityIntervals:
      type: object
      properties:
        start_at:
          type: string
          description: date and time for the start of the interval
          example: '2020-06-15T08:00:00Z'
        end_at:
          type: string
          description: date and time for the end of the interval
          example: '2020-06-15T09:00:00Z'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AdminAvailabilityGroups'
    AdminAvailabilityGroupIntervalsResponse:
      type: object
      properties:
        id:
          type: integer
          description: Origin group id
          example: 42
        name:
          type: string
          description: Group name generated from model description, or existing group name
          example: 2 Door Coupe/Convertible Roadster
        intervals:
          type: array
          description: An array of intervals with availability over start_at to end_at
          items:
            $ref: '#/components/schemas/AdminAvailabilityIntervals'
    BillingEstimate:
      type: object
      required:
      - program_id
      - transaction_days
      - currency_code
      - taxes
      - rates
      - fees
      - tax_total
      - rates_total
      - fees_total
      - tax_average_per_day
      - rates_average_per_day
      - fees_average_per_day
      properties:
        program_id:
          type: integer
          format: int64
          example: 1
        transaction_days:
          type: integer
          format: int32
          example: 3
        currency_code:
          type: string
          example: USD
        taxes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: sales tax
              total:
                type: number
                format: double
                example: 6
        rates:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: rental
              total:
                type: number
                format: double
                example: 60
              description:
                type: string
                example: 2 Days at $30.00 per day
        fees:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: facility
              total:
                type: number
                format: double
                example: 15
        tax_total:
          type: number
          format: double
          example: 6
        rates_total:
          type: number
          format: double
          example: 60
        fees_total:
          type: number
          format: double
          example: 15
        tax_average_per_day:
          type: number
          format: double
          example: 2
        rates_average_per_day:
          type: number
          format: double
          example: 20
        fees_average_per_day:
          type: number
          format: double
          example: 5
    AdminAvailabilityGroups:
      type: object
      properties:
        make:
          type: string
          description: Vehicle make for the group
          example: GMC
        model:
          type: string
          description: Vehicle model for the group
          example: Sierra 1500
        trim:
          type: string
          description: Vehicle trim for the group
          example: Elevation
        body_type:
          type: string
          description: Vehicle body type for the group
          example: Crew Cab
        power_train:
          type: string
          description: Vehicle power train for the group
          example: mechanical
        available_vehicles:
          type: array
          items:
            $ref: '#/components/schemas/AdminAvailabilityVehicles'
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource with id :id not found
              code:
                type: integer
                example: 6789
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Bad Request
              code:
                type: integer
                example: 6789
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Request is forbidden
              code:
                type: integer
                example: 6789
  securitySchemes:
    Auth0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://dealerware.auth0.com/oauth/token
          scopes: {}
