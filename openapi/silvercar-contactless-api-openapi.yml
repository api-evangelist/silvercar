openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Contactless API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Contactless
  description: Contactless Contract actions and resources
paths:
  /contracts/contactless/{uuid}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns contactless contract data
      operationId: getContractsContactless
      tags:
      - Contactless
      parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of Contactless Contract
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactlessContractResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /contracts/contactless/{uuid}/drivers/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns Contactless Contract/Driver Information
      operationId: getContractsContactlessDriver
      tags:
      - Contactless
      parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of Contactless Contract
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: The driver's ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactlessContractDriverResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /contracts/contactless/{uuid}/drivers/{id}/signatures:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Create a Signature Image for the Driver
      operationId: postContactlessDriverSignature
      tags:
      - Contactless
      parameters:
      - name: uuid
        in: path
        required: true
        description: The contract's UUID
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: The driver's ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  description: Driver Signature Base64 Image
                  type: string
                  format: base64
                  example: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  responses:
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Accepted media types is limited to JSON (application/json)
              code:
                type: integer
                example: 6789
    Success:
      description: Success
    UnprocessableEntity:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid resource id
              code:
                type: integer
                example: 6789
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource with id :id not found
              code:
                type: integer
                example: 6789
    NotAcceptable:
      description: Not Acceptable
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Missing headers in request
              code:
                type: integer
                example: 6789
  schemas:
    ContactlessContractDriverResponse:
      type: object
      required:
      - agreement_url
      - customer_name
      - dealership_name
      - first_name
      - fuel
      - fuel_percentage
      - last_name
      - metric
      - odometer
      - signature
      properties:
        agreement_url:
          type: string
          example: http://host.com/path/agreement.pdf
        customer_name:
          type: string
          description: The full name of the customer that is attached to the contract
          example: John Doe
        dealership_name:
          type: string
          description: The dealership's name where the contract was started at
          example: Car Dealership of North Anywhere
        first_name:
          type: string
          description: The driver's first name
          example: John
        fuel:
          type:
          - string
          - 'null'
          example: 15/16
        fuel_percentage:
          type:
          - number
          - 'null'
          format: float
          example: 98.5
        last_name:
          type: string
          description: The driver's last name
          example: Doe
        metric:
          type: boolean
          example: false
        odometer:
          type:
          - object
          - 'null'
          required:
          - value
          - unit
          properties:
            value:
              type: number
              format: float
              example: 1205.11
            unit:
              type: string
              example: km
        signature:
          type: boolean
          example: false
    ContactlessContractResponse:
      type: object
      properties:
        agreement_url:
          type: string
          example: http://host.com/path/agreement.pdf
        dealership_name:
          type: string
          example: Car Dealership of North Anywhere
        drive_protection_selections:
          type:
          - object
          - 'null'
          description: Whether each drive protection insurance category is selected.
          required:
          - collision_damage_warranty
          - loss_damage_warranty
          - renters_contingent_liability_insurance
          - supplemental_liability_insurance
          properties:
            collision_damage_warranty:
              type: boolean
              example: false
            loss_damage_warranty:
              type: boolean
              example: true
            renters_contingent_liability_insurance:
              type: boolean
              example: false
            supplemental_liability_insurance:
              type: boolean
              example: true
        fuel:
          type: string
          example: 15/16
        fuel_percentage:
          type: number
          format: float
          example: 98.5
        metric:
          type: boolean
          example: false
        odometer:
          type: object
          required:
          - value
          - unit
          properties:
            value:
              type: number
              format: float
              example: 20055.12
            unit:
              type: string
              example: km
        signature:
          type: boolean
          example: true
        toggles:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 123
              text:
                type: string
                example: You will return the car.
              order:
                type: integer
                example: 1
  securitySchemes:
    Auth0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://dealerware.auth0.com/oauth/token
          scopes: {}
