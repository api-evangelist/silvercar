        current_assignment:
          type:
          - object
          - 'null'
          description: 'The vehicle the transponder is installed on now, or null when it is not installed on a vehicle. Null does not guarantee deactivation succeeds: its tag may still be entered on a vehicle at this dealership. A transponder on a rented vehicle cannot be moved, so pickers can show it as unavailable.'
