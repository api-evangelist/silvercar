          example: 914
        toll_tag_number:
          type:
          - string
          - 'null'
          description: Optional legacy toll identifier. When sent with toll_transponder_id it must identify the same transponder (its external id or legacy tag), or the request fails with 422. Null is ignored; an empty string goes with removing the transponder.
          example: ALF1234567A
