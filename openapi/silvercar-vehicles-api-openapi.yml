openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Vehicles API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Vehicles
  description: Vehicle actions and resources
paths:
  /admin/contracts/{id}/unassign_vehicle:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    put:
      summary: Unassign the vehicle currently assigned to the given contract
      operationId: putAdminContractUnassignVehicle
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the contract
        schema:
          type: integer
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/contracts/{id}/vehicle:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    put:
      summary: Assign a Vehicle to the Given Contract
      operationId: putAdminContractVehicle
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the contract
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminContractVehicleRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/contracts/{id}/vehicles/available:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Retrieves a list of available vehicles for the given contract
      operationId: getAdminContractVehiclesAvailable
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The contract id
        schema:
          type: integer
      - name: fleet_id
        in: query
        required: false
        description: Overriding the fleet from the contract to list out available vehicles
        schema:
          type: integer
          example: 523
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number returned from collection based on total records and records per response
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 30
        description: Number records returned in collection in response
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminVehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/contracts/{id}/vehicles/available/search:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a list of available vehicles for a contract based on the provided query
      operationId: getAdminContractVehiclesAvailableSearch
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The contract id
        schema:
          type: integer
      - name: q
        in: query
        required: true
        description: Query parameter to search against indexed fields on vehicle
        schema:
          type: string
      - name: fleet_id
        in: query
        required: false
        description: Overriding the fleet from the contract to search for available vehicles
        schema:
          type: integer
          example: 523
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number returned from collection based on total records and records per response
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 30
        description: Number records returned in collection in response
      - name: sort
        in: query
        description: The sort order is ascending unless the column name is prefixed with a minus (U+002D HYPHEN-MINUS, "-"), in which case it will be descending.
        required: false
        schema:
          $ref: '#/components/schemas/AdminVehicleSortColumns'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminVehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/dealerships/{id}/calendar/vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a paginated list of Vehicle objects for the Calendar
      operationId: getDealershipCalendarVehicles
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: The sort order for each sort field MUST be ascending unless it is prefixed with a minus (U+002D HYPHEN-MINUS, "-"), in which case it MUST be descending. Allowed Sort fields are make, model, year, mileage, vin, stock_number, license, status
        schema:
          type: string
          example: -make,vin,-model
      - name: fleet_ids
        in: query
        required: false
        description: Filter vehicles results to those that belong to these fleet ids
        schema:
          type: array
          items:
            type: integer
      - name: active
        in: query
        required: false
        description: Filter vehicles to those that are either active or inactive
        schema:
          type: boolean
      - name: status
        in: query
        required: false
        description: Comma separated list of states (in_prep staged returned)
        schema:
          type: array
          items:
            type: string
            example: staged
      - name: mileage_min
        in: query
        required: false
        description: Find Vehicles with mileage in kilometers greater than or equal to mileage_min
        schema:
          type: number
      - name: mileage_max
        in: query
        required: false
        description: Find Vehicles with mileage in kilometers less than or equal to mileage_max
        schema:
          type: number
      - name: make
        in: query
        required: false
        description: Comma Separated list of makes to filter vehicles by
        schema:
          type: string
          example: Ford,Toyota
      - name: model
        in: query
        required: false
        description: Comma Separated list of models to filter vehicles by
        schema:
          type: string
          example: Focus,Camry
      - name: page
        in: query
        required: false
        description: The page to be fetched, by default 1
        schema:
          type: number
      - name: per_page
        in: query
        required: false
        description: Number of items per page to be fetched, by default 30
        schema:
          type: number
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCalendarVehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/dealerships/{id}/fleets/contracts_vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Fetch the fleets for a location, along with the contracts (within the given…
      operationId: getAdminDealershipFleetsContractsAndVehicles
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the range to fetch contracts for (inclusive)
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T00:00:00Z'
      - name: end_at
        description: The timestamp for the end of the range to fetch contracts for (inclusive)
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-21T00:00:00Z'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/AdminDealershipFleetsContractsVehiclesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/dealerships/{id}/vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a paginated list of Vehicle objects associated with a dealership
      description: Returns a paginated list of Vehicle objects associated with a dealership. Supports filtering by date ranges and sorting by various fields including maturity_date, in_service_date, and rdr_date.
      operationId: getDealershipVehicles
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: The sort order for each sort field MUST be ascending unless it is prefixed with a minus (U+002D HYPHEN-MINUS, "-"), in which case it MUST be descending.
        schema:
          $ref: '#/components/schemas/AdminVehicleSortColumns'
      - name: fleet_ids
        in: query
        required: false
        description: Filter vehicles results to those that belong to these fleet ids
        schema:
          type: array
          items:
            type: integer
      - name: active
        in: query
        required: false
        description: Filter vehicles to those that are either active or inactive
        schema:
          type: boolean
      - name: status
        in: query
        required: false
        description: Filter vehicles based on their current state
        schema:
          type: string
      - name: telematics_state
        in: query
        required: false
        description: Filter vehicles based on their telematics source
        schema:
          $ref: '#/components/schemas/AdminVehicleTelematicsState'
      - name: maturity_date_from
        in: query
        required: false
        description: Filter vehicles with maturity_date greater than or equal to this date (YYYY-MM-DD format)
        schema:
          type: string
          format: date
          example: '2025-08-01'
      - name: maturity_date_to
        in: query
        required: false
        description: Filter vehicles with maturity_date less than or equal to this date (YYYY-MM-DD format)
        schema:
          type: string
          format: date
          example: '2025-08-31'
      - name: in_service_date_from
        in: query
        required: false
        description: Filter vehicles with in_service_date greater than or equal to this date (YYYY-MM-DD format)
        schema:
          type: string
          format: date
          example: '2025-07-01'
      - name: in_service_date_to
        in: query
        required: false
        description: Filter vehicles with in_service_date less than or equal to this date (YYYY-MM-DD format)
        schema:
          type: string
          format: date
          example: '2025-07-31'
      - name: rdr_date_from
        in: query
        required: false
        description: Filter vehicles with parking lot rdr_date greater than or equal to this date (YYYY-MM-DD format)
        schema:
          type: string
          format: date
          example: '2025-08-01'
      - name: rdr_date_to
        in: query
        required: false
        description: Filter vehicles with parking lot rdr_date less than or equal to this date (YYYY-MM-DD format)
        schema:
          type: string
          format: date
          example: '2025-08-31'
      - name: page
        in: query
        required: false
        description: The page to be fetched, by default 1
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of items per page to be fetched, by default 30
        schema:
          type: integer
      - name: defleet_vehicles
        in: query
        required: false
        description: Filter vehicles to those that meet the dealership's defleet criteria
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminVehicleResponse'
            text/csv:
              schema:
                $ref: '#/components/schemas/AdminVehicleCSVResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    post:
      summary: Creates a new Vehicle for a Dealership and assigns it to a list of Fleets
      operationId: postDealershipVehicle
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehicleRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/fleets/{id}/contracts:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Creates a new Contract associated with a Fleet
      operationId: postFleetContract
      tags:
      - Vehicles
      parameters:
      - name: platform
        in: header
        required: false
        description: Header to let us know platform contract was booked on
        schema:
          type: string
      - name: app_name
        in: header
        required: false
        description: Header to let us know name of application
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminFleetContractRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreatedWithLocationHeader'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/fleets/{id}/vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Creates a new Vehicle associated with a Fleet
      operationId: postFleetVehicles
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the fleet
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehicleRequest-2'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/vehicles/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a singular Vehicle object
      operationId: getVehicle
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vehicle
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicleResponse-2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Updates a Vehicle's Fleets
      operationId: putVehicleFleets
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vehicle
        schema:
          type: integer
      requestBody:
        required: true
        description: Either `fleet_id` or `fleet_ids` must be present in the request body. If both are present, `fleet_ids` will be used.
        content:
          application/json:
            schema:
              type: object
              properties:
                fleet_id:
                  type: integer
                fleet_ids:
                  type: array
                  items:
                    type: integer
            example:
              fleet_ids:
              - 12
              - 34
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      summary: Changes a Vehicle's managed toll transponder
      description: Installs, replaces, moves, or removes the vehicle's managed toll transponder. Assignment history and the legacy toll tag fields change together, or not at all. Only available at dealerships with toll equipment management enabled. A transponder installed on another vehicle moves only with confirm_toll_transponder_move, and no change may touch a rented vehicle. A save that collides with a concurrent change also returns 409; retry it. fleet_id and fleet_ids are still accepted and behave as they do with PUT.
      operationId: patchAdminVehicle
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vehicle
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVehiclePatchRequest'
            example:
              toll_transponder_id: 914
              confirm_toll_transponder_move: true
      responses:
        '200':
          description: The vehicle after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicleResponse-2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/AdminDealershipTollTransponderConflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/vehicles/{id}/events:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get all telematics events for a given vehicle
      operationId: getVehicleEvents
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vehicle
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/AdminVehicleEventCSVResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/vehicles/{id}/fleet:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    put:
      summary: Updates a Vehicle's Fleet
      operationId: putVehicleFleet
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vehicle
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fleet_id:
                  type: integer
                fleet_ids:
                  type: array
                  items:
                    type: integer
            example:
              fleet_id: 12
              fleet_ids:
              - 12
              - 34
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/vehicles/{id}/issues:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get all issues for a given vehicle (paginated)
      operationId: getVehicleIssues
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vehicle
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: page of the resource to fetch
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: number of records per page
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminIssueResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    post:
      summary: Create new issue for the vehicle
      operationId: postVehicleIssue
      tags:
      - Vehicles
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the vehicle
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminIssueRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/vehicles/{id}/telemetry:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
