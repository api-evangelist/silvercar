openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Dealerships API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Dealerships
  description: Dealership actions and resources
paths:
  /admin/dealerships:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    - name: q
      in: query
      required: false
      schema:
        type: string
      description: Returns dealerships whose name includes the specified string
    - $ref: '#/components/parameters/PageQueryParameter'
    - $ref: '#/components/parameters/PerPageQueryParameter'
    get:
      summary: Returns the Dealership objects available to the authenticated user
      operationId: getDealerships
      tags:
      - Dealerships
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/dealerships/search:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Deprecated – use `/admin/dealerships?name` instead
      description: 'This endpoint is deprecated and will be removed in a future release.

        Use the `/admin/dealerships` endpoint with the `q` query parameter instead, e.g. `/admin/dealerships?q=AAA`.'
      operationId: getDealershipSearch
      tags:
      - Dealerships
      deprecated: true
      parameters:
      - name: q
        in: query
        required: true
        description: Query parameter representing a search for a Dealership's name or OEM dealer code
        schema:
          type: string
      - $ref: '#/components/parameters/PageQueryParameter'
      - $ref: '#/components/parameters/PerPageQueryParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/dealerships/{dealership_id}/webhooks:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a paginated list of dealership webhooks
      operationId: getAdminDealershipWebhooks
      tags:
      - Dealerships
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: The page number to fetch, defaulting to 1.
        schema:
          type: integer
          example: 1
      - name: per_page
        in: query
        required: false
        description: The number of webhook records to return, defaulting to 30.
        schema:
          type: integer
          example: 30
      responses:
        '200':
          description: Success
          headers:
            page:
              schema:
                type: integer
                example: 1
            per-page:
              schema:
                type: integer
                example: 30
            total:
              schema:
                type: integer
                example: 2
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    post:
      summary: Creates a new webhook for a dealership
      operationId: postAdminDealershipWebhook
      tags:
      - Dealerships
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDealershipWebhookCreateRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDealershipWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{dealership_id}/webhooks/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a dealership webhook
      operationId: getAdminDealershipWebhook
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the webhook
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDealershipWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Updates a dealership webhook
      operationId: putAdminDealershipWebhook
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the webhook
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDealershipWebhookUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDealershipWebhookResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Deletes a dealership webhook
      operationId: deleteAdminDealershipWebhook
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the webhook
        schema:
          type: integer
      - name: dealership_id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/dealerships/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns the requested dealership object to the authenticated user
      operationId: getDealership
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: numeric id of the requested dealership
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDealershipDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    patch:
      summary: Updates the Dealership and/or its Fleets' Settings
      operationId: patchDealershipAndFleetSettings
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: numeric id of the requested dealership
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminDealershipRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{id}/address:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns the dealership address
      operationId: getDealershipAddress
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/AdminDealershipAddressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Updates the dealership address
      operationId: putDealershipAddress
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: numeric id of the requested dealership
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDealershipAddressRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{id}/availability/intervals:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability for all cars in a dealership by 30-minute interval for every…
      operationId: getDealershipAvailabilityIntervals
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: exclude_contract_id
        description: If provided, the contract associated with the ID will be excluded from availability calculations. This is used for "modify" contract calculations
        in: query
        required: false
        schema:
          type: number
          example: 12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipAvailabilityIntervalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{id}/availability/intervals/continuous:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability from a static start time for all cars in a dealership by…
      operationId: getDealershipAvailabilityIntervalsContinuous
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: reservation_start_at
        description: The timestamp for the start of reservation, which availability is calculated from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: exclude_contract_id
        description: If provided, the contract associated with the ID will be excluded from availability calculations. This is used for "modify" contract calculations
        in: query
        required: false
        schema:
          type: number
          example: 12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipAvailabilityIntervalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{id}/availability/intervals/continuous/daily:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability from a static start time for all cars in a dealership by day…
      operationId: getDealershipAvailabilityIntervalsContinuousDaily
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: reservation_start_at
        description: The timestamp for the start of reservation, which availability is calculated from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:12:26Z'
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T00:00:00Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-21T00:00:00Z'
      - name: exclude_contract_id
        description: If provided, the contract associated with the ID will be excluded from availability calculations. This is used for "modify" contract calculations
        in: query
        required: false
        schema:
          type: number
          example: 12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipAvailabilityIntervalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{id}/availabiliy/intervals/daily:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get availability for all cars in a dealership by day for every day between…
      operationId: getDealershipAvailabilityIntervalsDaily
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-15T00:00:00Z'
      - name: end_at
        description: The timestamp for the end of the availability range
        in: query
        required: true
        schema:
          type: string
          format: date-time
          example: '2020-06-21T00:00:00Z'
      - name: exclude_contract_id
        description: If provided, the contract associated with the ID will be excluded from availability calculations. This is used for "modify" contract calculations
        in: query
        required: false
        schema:
          type: number
          example: 12345
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipAvailabilityIntervalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dealerships/{id}/calendar/booking_channels:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns unique booking channel values for calendar filtering
      operationId: getDealershipCalendarBookingChannels
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - booking_channels
                properties:
                  booking_channels:
                    type: array
                    items:
                      type: string
                    example:
                    - dealerware
                    - mykaarma
                    - xtime
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/dealerships/{id}/calendar/contracts:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a paginated list of Reservations or Contracts for a Dealership Calendar
      operationId: getDealershipCalendarContracts
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - in: query
        name: status_in
        required: false
        schema:
          type: array
          items:
            type: string
            example: booked,cancelled
        description: Include only Contracts with these statuses (booked, cancelled, pending_agreement, started, finished or no_showed)
      - in: query
        name: status_not_in
        required: false
        schema:
          type: array
          items:
            type: string
            example: started
        description: Include Contracts that are not in these statuses (booked, cancelled, pending_agreement, started, finished or no_showed)
      - in: query
        name: start_at
        required: false
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:22:26Z'
        description: Include Contracts created after or on this date and time
      - in: query
        name: end_at
        required: false
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:22:26Z'
        description: Include Contracts created before or on this date and time
      - in: query
        name: occurs_during
        required: false
        schema:
          type: string
          example: 2020-06-15T20:22:26Z,2020-07-15T20:22:26Z
        description: A string containing the from date and to date separated by a comma
      - in: query
        name: fleet_ids
        required: false
        schema:
          type: array
          items:
            type: number
          example: 1,2
        description: Comma separated list of integers (Fleet ID)
      - in: query
        name: agreement_id
        required: false
        schema:
          type: number
          example: 1
        description: Include Contracts with this Agreement ID
      - in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
          example: loaner
        description: Include Contracts with this type (loaner or rental)
      - in: query
        name: booking_channels
        required: false
        schema:
          type: array
          items:
            type: string
          example: xtime,mykaarma
        description: Comma separated list of booking channel slugs (e.g. dealerware, xtime, mykaarma)
      - name: page
        in: query
        required: false
        schema:
          type: number
        description: The page to be fetched, by default 1
      - name: per_page
        in: query
        required: false
        schema:
          type: number
        description: Number of items per page to be fetched, by default 30
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCalendarContractResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/dealerships/{id}/calendar/vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a paginated list of Vehicle objects for the Calendar
      operationId: getDealershipCalendarVehicles
      tags:
      - Dealerships
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        description: The sort order for each sort field MUST be ascending unless it is prefixed with a minus (U+002D HYPHEN-MINUS, "-"), in which case it MUST be descending. Allowed Sort fields are make, model, year, mileage, vin, stock_number, license, status
        schema:
          type: string
          example: -make,vin,-model
      - name: fleet_ids
        in: query
        required: false
        description: Filter vehicles results to those that belong to these fleet ids
        schema:
          type: array
          items:
            type: integer
      - name: active
        in: query
        required: false
        description: Filter vehicles to those that are either active or inactive
        schema:
          type: boolean
      - name: status
        in: query
        required: false
        description: Comma separated list of states (in_prep staged returned)
        schema:
          type: array
          items:
            type: string
            example: staged
      - name: mileage_min
        in: query
        required: false
        description: Find Vehicles with mileage in kilometers greater than or equal to mileage_min
        schema:
          type: number
      - name: mileage_max
        in: query
        required: false
        description: Find Vehicles with mileage in kilometers less than or equal to mileage_max
        schema:
          type: number
      - name: make
        in: query
        required: false
        description: Comma Separated list of makes to filter vehicles by
        schema:
          type: string
          example: Ford,Toyota
      - name: model
        in: query
        required: false
        description: Comma Separated list of models to filter vehicles by
        schema:
          type: string
          example: Focus,Camry
      - name: page
        in: query
        required: false
        description: The page to be fetched, by default 1
        schema:
          type: number
      - name: per_page
        in: query
        required: false
        description: Number of items per page to be fetched, by default 30
        schema:
          type: number
      responses:
