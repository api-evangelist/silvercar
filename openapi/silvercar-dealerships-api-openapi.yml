  /admin/dealerships/{id}/vehicles/search:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns the list of Vehicle objects associated with a dealership based on…
      description: Returns the list of Vehicle objects associated with a dealership based on search query. Supports sorting by various fields including maturity_date, in_service_date, and rdr_date.
      operationId: getDealershipVehiclesSearch
      tags:
      - Dealerships
      parameters:
      - name: available_only
        in: query
        required: false
        description: Toggle to only include available vehicles in search results, defaults to false.
        schema:
          type: boolean
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: q
        in: query
        required: false
        description: Query parameter to search against indexed fields on Vehicle
        schema:
          type: string
      - name: sort
        in: query
        description: The sort order is ascending unless the column name is prefixed with a minus (U+002D HYPHEN-MINUS, "-"), in which case it will be descending.
        required: false
        schema:
          $ref: '#/components/schemas/AdminVehicleSortColumns'
      - name: fleet_id
        in: query
        required: false
        description: Query parameter to search via a given fleet id
        schema:
          type: string
      - name: fleet_ids
        in: query
        required: false
        description: Filter vehicles results to those that belong to these fleet ids
        schema:
          type: array
          items:
            type: integer
      - name: active
        in: query
        required: false
        description: Filter vehicles to those that are either active or inactive
        schema:
          type: boolean
      - name: status
        in: query
        required: false
        description: Filter vehicles based on their current state
        schema:
          type: string
      - name: telematics_state
        in: query
        required: false
        description: Filter vehicles based on their telematics source
        schema:
          $ref: '#/components/schemas/AdminVehicleTelematicsState'
      - name: available_by_program
        in: query
        required: false
        description: Toggle to only include available vehicles by program in search results, defaults to false.
        schema:
          type: boolean
      - name: page
        in: query
        required: false
        description: The page to be fetched, by default 1
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of items per page to be fetched, by default 30
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminVehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/user/dealerships/{dealership_id}/roles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns the user roles for a given location
      description: 'Returns effective user roles for a dealership. HopDrive roles are returned only for capabilities supported by the dealership''s effective HopDrive valet_type set: manage_valet_moves requires valet or third_party_labor, and manage_guest_rides requires guest_rides.'
      operationId: getUserDealershipRoles
      tags:
      - Dealerships
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: the dealership id for which you are fetching the user's roles
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserDealershipRolesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /dealerships/{dealership_id}/reservations/{reservation_id}/customer:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get the customer information for a reservation
      operationId: getReservationCustomer
      tags:
      - Dealerships
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: the Dealership ID
        schema:
          type: integer
      - name: reservation_id
        in: path
        required: true
        description: the Reservation ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCustomerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update the customer information for a reservation
      operationId: putReservationCustomer
      tags:
      - Dealerships
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: the Dealership ID
        schema:
          type: integer
      - name: reservation_id
        in: path
        required: true
        description: the Reservation ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCustomerUpdateRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    AdminVehicleCSVResponse:
      type: string
      example: 'connected, connected_car_device_firmware, connected_car_data_last_updated, id, license, make, model, odometer_value, odometer_unit, off_lot, physical_location, power_train, status, stock_number, toll_tag_number, vin, year, rdr_date, maturity_date

        true, 281110619:159:11, 2020-06-11T15:08:53Z, 23561, DNL445, Audi, Q5, 20055, km, true, Lot A, mechanical, rented, VV111, HMSJNFDS, 1FT7W2BT4DEB5192, 2020, 2024-03-15, 2024-06-15

        '
    ReservationCustomerResponse:
      type: object
      properties:
        billing:
          type: object
          properties:
            card_type:
              type: string
            last_four:
              type: string
            expiration_month:
              type: string
            expiration_year:
              type: string
        current_state:
          type: string
          example: started
        customer:
          type: object
          properties:
            id:
              type: integer
              example: 1
            email:
              type: string
              example: customer@example.com
            first_name:
              type: string
              example: Harry
              description: Customer first name
            last_name:
              type: string
              example: Potter
              description: Customer last name
            phone_number:
              type: string
              example: 1234567890
              description: Customer phone number
            language:
              type: string
              example: English
              description: Customer language
            deleted:
              type: boolean
              description: has this account been deleted
        drivers_license:
          type: object
          properties:
            id:
              type: integer
              example: 2
            number:
              type: string
              example: TX12332
            state:
              type: string
              example: TX
            country:
              type: string
              example: US
            date_of_birth:
              type: string
              format: date
              example: '1979-03-03'
            expiration:
              type: string
              format: date
              example: '2040-03-03'
            name:
              type: string
              example: Harry Potter
            line1:
              type: string
              example: 2415 Highway 71 East
            line2:
              type: string
              example: Suite 761
            city:
              type: string
              example: Del Valle
            zip:
              type: string
              example: 90210
        insurance_expires_on:
          type: string
          format: datetime
          example: '2030-01-01'
          description: Policy expiration date
        sufficiency:
          type:
          - object
          - 'null'
          properties:
            loaner:
              $ref: '#/components/schemas/InsuranceSufficiencyLoanerProperties'
            rental:
              $ref: '#/components/schemas/InsuranceSufficiencyRentalProperties'
    AdminVehicleSortColumns:
      type: string
      enum:
      - created_at
      - updated_at
      - license
      - model
      - odometer
      - physical_location
      - status
      - stock_number
      - year
      - vin
      - maturity_date
      - in_service_date
      - rdr_date
    UnsettledBalanceDetails:
      type: object
      properties:
        contract_finished_at:
          type: string
          example: '2022-10-25'
          description: Date contract ended of format YYYY-MM-DD
        name:
          type: string
        phone_number:
          type: string
        vehicle_group_name:
          type: string
        outstanding_balance:
          type: number
          format: float
        ro_number:
          type: string
        stock_number:
          type: string
        transaction_status:
          type: string
        contract_id:
          type: integer
        location_id:
          type: integer
        statement_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        confirmation_token:
          type: string
        payer_type:
          type: string
    AdminFleetRequest:
      type: object
      properties:
        name:
          type: string
          example: Loaner
        agreement_id:
          type:
          - number
          - 'null'
          example: 5
          description: Omit or pass null to keep the current agreement; pass an ID to assign one
        program_type:
          type: string
          example: rental
          description: A string representing the type of program the fleet is in (courtesy, rental, etc)
        require_insurance_sufficiency:
          type: string
          enum:
          - none
          - loaner
          - rental
          - loaner_rental
          example: loaner_rental
          description: Specifies when insurance sufficiency checks are required (none, loaner, rental, or loaner_rental)
    AdminUserDealershipRolesResponse:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: location_manager
    InsuranceSufficiencyRentalProperties:
      type:
      - object
      - 'null'
      properties:
        sufficient:
          type: boolean
          example: true
          description: Represents if the insurance document is sufficient
        status:
          type: string
          example: pass
          description: Status of the insurance document sufficiency
        valid_until:
          type: string
          example: '2024-12-31T23:59:59Z'
          description: Timestamp of when the insurance document sufficiency is valid until
        checked_at:
          type: string
          example: '2024-01-01T12:00:00Z'
          description: Timestamp of when the insurance document sufficiency was last checked
        details:
          type: object
          description: Additional details about the insurance document sufficiency provided by 3rd party
          properties:
            comprehensive_coverage_meets_requirements:
              type: string
              example: fail
            expiration_date_comparison:
              type: string
              example: pass
            insureds_match:
              type: string
              example: unknown
            rental_covered_for_collision:
              type: string
              example: pass
            required_policy_information_is_present:
              type: string
              example: pass
    RevenueReportItemization:
      type: object
      properties:
        daily_rate:
          type: number
          format: double
          description: Daily rate
          example: 100
        amount:
          type: number
          format: double
          description: Amount
          example: 200
        fuel:
          type: number
          format: double
          description: Fuel
          example: 30
        fuel_service:
          type: number
          format: double
          description: Fuel Service
          example: 5
        other:
          type: number
          format: double
          description: Other for the data range
          example: 145.38
        taxes:
          type: number
          format: double
          description: Taxes for the data range
          example: 3.28
        payment_processor_fee:
          type: number
          format: double
          description: Braintree fees for the data range
          example: -4.33
        net_to_dealership:
          type: number
          format: double
          description: Net to Dealership for the data range
          example: 134.7
    AdminCalendarVehicleResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        make:
          type: string
          example: Ford
        model:
          type: string
          example: Focus
        power_train:
          type: string
          example: mechanical
        year:
          type: number
          example: 2018
        mileage:
          type: object
          properties:
            value:
              type: number
              format: float
              example: 20055.12
            unit:
              type: string
              example: km
        vin:
          type: string
          example: 1FADP3K2XJL234567
        stock_number:
          type: string
          example: 1234567
        license:
          type: string
          example: 123ABC
        status:
          type: string
          example: rented
        color:
          type: string
          example: Red
        links:
          type: object
          properties:
            fleet:
              $ref: '#/components/schemas/HypermediaLink'
            fleets:
              type: array
              items:
                $ref: '#/components/schemas/HypermediaLink'
    AdminCalendarContractResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        contract_type:
          type: string
          example: contract
          description: This is either a contract or reservation
        status:
          type: string
          example: booked
          description: booked, cancelled, pending_agreement, started, finished or no_showed
        created_at:
          type: string
          example: '2022-11-15T12:01:40-05:00'
        scheduled_pickup_at:
          type: string
          example: '2022-11-15T12:01:40-05:00'
        scheduled_dropoff_at:
          type: string
          example: '2022-11-15T12:01:40-05:00'
        actual_pickup_at:
          type:
          - string
          - 'null'
          example: '2022-11-15T12:01:40-05:00'
        actual_dropoff_at:
          type:
          - string
          - 'null'
          example: '2022-11-15T12:01:40-05:00'
        service_advisor:
          type:
          - string
          - 'null'
          example: Ted Smith
        vehicle_id:
          type:
          - number
          - 'null'
          example: 1
        fleet_id:
          type: number
          example: 2
        calendar_group:
          type: string
          example: unscheduled
          description: Either scheduled or unscheduled
        has_valet_task:
          type: boolean
          example: true
          description: true if the Contract has at least one valet task
        task_ids:
          type: array
          items:
            type: number
          example:
          - 1
          - 2
        service_vehicle_id:
          type:
          - string
          - 'null'
          example: 123abc
        repair_order:
          type:
          - string
          - 'null'
          example: abc123
        purchase_order:
          type:
          - string
          - 'null'
          example: PO123
          description: The optional purchase order number associated with this contract
        booking_application:
          type:
          - string
          - 'null'
          example: scheduler
          description: Client application type that created the reservation (e.g. web, iphone-appstore, scheduler).
        booking_channel:
          type:
          - string
          - 'null'
          example: mykaarma
          description: Partner integration source for the booking (e.g. mykaarma, xtime, redcap, toyota-oneapp) or dealerware for Dealerware-native bookings.
        agreement:
          $ref: '#/components/schemas/AdminCalendarAgreementResponse'
        customer:
          $ref: '#/components/schemas/AdminCalendarCustomerResponse'
    HypermediaLink:
      type: object
      properties:
        id:
          type: integer
          example: 2
          description: ID of the associated resource
        href:
          type: string
          example: https://api.dw-tst.com/admin/some_resources/2
          description: Link to the associated resource
    ReservationCustomerUpdateRequest:
      type: object
      required:
      - first_name
      - last_name
      - phone_number
      - language
      properties:
        first_name:
          type: string
          example: Roonil
          description: Customer first name
        last_name:
          type: string
          example: Wazlib
          description: Customer last name
        email:
          type: string
          example: harry@hogwarts.gov.uk
          description: Customer email - required if dealership has email set as its notification method in its location settings
        phone_number:
          type: string
          example: 1234567890
          description: Phone number
        language:
          type: string
          example: English
          description: Customer language
    AdminCalendarAgreementResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        insurance_form:
          type: string
          example: Custom
          description: Custom, Arrowhead, PDP, Sedgwick, SedgwickCdw or AutoNation
    AdminDealershipReportTransactions:
      type: array
      description: Collection of transactions
      items:
        $ref: '#/components/schemas/TransactionDetails'
    AdminDealershipAddressResponse:
      type: object
      required:
      - city
      - country
      - id
      - line1
      - line2
      - postal_code
      - subregion
      properties:
        city:
          type: string
          example: North Miami
        country:
          type:
          - string
          - 'null'
          example: US
        id:
          type: integer
          example: 123
        line1:
          type: string
          example: 1995 NE 142nd St.
        line2:
          type:
          - string
          - 'null'
          example: Suite 22
        postal_code:
          type: string
          example: '33134'
        subregion:
          type:
          - string
          - 'null'
          example: FL
    AdminOdometer:
      type: object
      required:
      - value
      - unit
      properties:
        value:
          type: number
          format: float
          example: 3293.5
          description: 0.0 indicates no reading was found
        unit:
          type: string
          example: km
    UpdateAdminDealershipRequest:
      type: object
      properties:
        email:
          type: string
          example: john.doe@silvercar.com
        name:
          type: string
          example: Dealership 1
        onboarding_complete:
          type: boolean
          example: false
        phone_number:
          type: string
          example: (555) 123-4567
        fleet_settings:
          type: array
          items:
            type: object
            properties:
              fleet_id:
                type: integer
                example: 123
              repair_order_number_required:
                type: boolean
                example: false
              allow_charge_later:
                type: boolean
                example: true
              allow_manual_signature:
                type: boolean
                example: false
              require_customer_vin:
                type: boolean
                example: false
              guided_walkaround_enforced:
                type: boolean
                example: false
              sales_lead_enabled:
                type: boolean
                example: true
                description: whether Service to Sales lead generation is enabled for the fleet
              sales_lead_offset_hours:
                type: integer
                example: 3
                description: how many hours prior to a contract end a sales lead should be created (1-12)
              sales_lead_cms_config_email:
                type:
                - string
                - 'null'
                example: leads@dealer.com
                description: email address the Service to Sales lead configuration should notify in ADF format.
    AdminDealershipKpisRequest:
      type: object
      properties:
        kpi_types:
          type: array
          items:
            type: string
            description: List of expected KPI in the response
          example:
          - avg_length_of_loan
          - utilization
        range_type:
          type: string
          description: 'Specify a fixed or custom date range to calculated KPIs value.  Expected values: wtd, mtd, ytd, last_month, custom'
          example: mtd
        start_date:
          type: string
          format: date
          example: '2022-09-01'
          description: 'The first date in the range. Format: YYYY-MM-DD, only required if specifying a custom period to calcualte a KPI'
        end_date:
          type: string
          format: date
          example: '2022-11-01'
          description: 'The last date in the range. Format: YYYY-MM-DD, default value is current date'
        fleet_id:
          type: integer
          description: Only used for the utilization_by_fleet KPI. The id of the fleet to calculate KPIs for.
          example: 1
    AdminServiceAdvisorsResponse:
      type: object
      properties:
        id:
          type: integer
          example: 123
        first_name:
          type: string
          example: Hugh
        last_name:
          type: string
          example: Mann
    AdminDealershipSettingsResponse:
