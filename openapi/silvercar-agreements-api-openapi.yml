- Auth0: []
tags:
- name: Agreements
  description: Agreement actions and resources
paths:
  /admin/agreements/mappable_fields:
    get:
      summary: Get all fields that can be mapped onto an agreement
      operationId: getMappableFields
      tags:
      - Agreements
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgreementsMappableFieldsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    AdminAgreementsMappableFieldsResponse:
      description: A list of field names that can be mapped onto an agreement
      type: array
      items:
        type: string
        example:
        - customer_name
        - signature
        - vin
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid authorization token
              code:
                type: integer
                example: 6789
  securitySchemes:
    Auth0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://dealerware.auth0.com/oauth/token
          scopes: {}
