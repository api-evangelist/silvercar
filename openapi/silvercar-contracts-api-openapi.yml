      operationId: getAdminDealershipContractsManifestToday
      tags:
      - Contracts
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: filter
        in: query
        required: false
        description: Filters contracts to those that are requested. Default (no value) returns all.
        schema:
          type: string
          enum:
          - all
          - pickup
          - dropoff
          - pickup_dropoff
      - name: per_page
        in: query
        schema:
          type: integer
          default: 30
        description: Number of records returned in a collection in the response.
        required: false
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        description: Page number returned from the collection based on the total records and records per response
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDealershipContractManifestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /admin/dealerships/{id}/fleets/contracts_vehicles:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Fetch the fleets for a location, along with the contracts (within the given…
      operationId: getAdminDealershipFleetsContractsAndVehicles
      tags:
      - Contracts
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - name: start_at
        description: The timestamp for the start of the range to fetch contracts for (inclusive)
        in: query
