    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns a paginated list of Reservations or Contracts for a Dealership Calendar
      operationId: getDealershipCalendarContracts
      tags:
      - Contracts
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the dealership
        schema:
          type: integer
      - in: query
        name: status_in
        required: false
        schema:
          type: array
          items:
            type: string
            example: booked,cancelled
        description: Include only Contracts with these statuses (booked, cancelled, pending_agreement, started, finished or no_showed)
      - in: query
        name: status_not_in
        required: false
        schema:
          type: array
          items:
            type: string
            example: started
        description: Include Contracts that are not in these statuses (booked, cancelled, pending_agreement, started, finished or no_showed)
      - in: query
        name: start_at
        required: false
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:22:26Z'
        description: Include Contracts created after or on this date and time
      - in: query
        name: end_at
        required: false
        schema:
          type: string
          format: date-time
          example: '2020-06-15T20:22:26Z'
        description: Include Contracts created before or on this date and time
      - in: query
        name: occurs_during
        required: false
        schema:
          type: string
          example: 2020-06-15T20:22:26Z,2020-07-15T20:22:26Z
        description: A string containing the from date and to date separated by a comma
      - in: query
        name: fleet_ids
        required: false
        schema:
          type: array
          items:
            type: number
          example: 1,2
        description: Comma separated list of integers (Fleet ID)
      - in: query
        name: agreement_id
        required: false
        schema:
          type: number
          example: 1
        description: Include Contracts with this Agreement ID
      - in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
          example: loaner
        description: Include Contracts with this type (loaner or rental)
      - in: query
        name: booking_channels
        required: false
        schema:
          type: array
          items:
            type: string
          example: xtime,mykaarma
        description: Comma separated list of booking channel slugs (e.g. dealerware, xtime, mykaarma)
      - name: page
        in: query
        required: false
        schema:
          type: number
        description: The page to be fetched, by default 1
      - name: per_page
        in: query
        required: false
        schema:
          type: number
        description: Number of items per page to be fetched, by default 30
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminCalendarContractResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
