openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Contracts API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Contracts
  description: Contract actions and resources
paths:
  /admin/contracts/{contract_id}/notes:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get the notes for a contract
      operationId: getContractNotes
      tags:
      - Contracts
      parameters:
      - name: contract_id
        in: path
        required: true
        description: the Contract ID
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Page number returned from the collection based on the total records and records per response
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of records to include in the page
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractNotesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add a note for a contract
      operationId: postContractNote
      tags:
      - Contracts
      parameters:
      - name: contract_id
        in: path
        required: true
        description: the Contract ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractNoteAddRequest'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/contracts/{contract_id}/notes/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    put:
      summary: Update a note for a contract
      operationId: putContractNote
      tags:
      - Contracts
      parameters:
      - name: contract_id
        in: path
        required: true
        description: the Contract ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: the Note ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractNoteUpdateRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete a note for a contract
      operationId: deleteContractNote
      tags:
      - Contracts
      parameters:
      - name: contract_id
        in: path
        required: true
        description: the Contract ID
        schema:
          type: integer
      - name: id
        in: path
        required: true
        description: the Note ID
        schema:
          type: integer
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/contracts/{id}:
    parameters:
    - name: api-version
