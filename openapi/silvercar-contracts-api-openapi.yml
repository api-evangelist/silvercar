        '404':
          $ref: '#/components/responses/NotFound'
  /contracts/contactless/{uuid}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Returns contactless contract data
      operationId: getContractsContactless
      tags:
      - Contracts
      parameters:
      - name: uuid
        in: path
        required: true
        description: UUID of Contactless Contract
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactlessContractResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
  /contracts/contactless/{uuid}/signatures:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Creates a new signature associated with a contactless contract
      description: 'Creates a signature for the reservation identified by the contactless uuid token.

        If contactless cache already exists, it is reused.

        If contactless cache does not exist, it is created lazily from request values (when provided) or defaults.

        Required body field: image.

        Optional body fields: fuel_percentage, odometer.'
      operationId: postContractsContactlessSignatures
      tags:
      - Contracts
      parameters:
      - name: uuid
        in: path
        required: true
        description: The uuid token (reservation confirmation token) of the contactless contract
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureRequest'
            examples:
              image_only:
                summary: Signature image only
                value:
                  image: V2hhdCdzIHVwIHRoaXMgaXMgbXkgYmFzZTY0IGVuY29kZWQgc2hpdA==
              image_with_odometer:
                summary: Signature with odometer
                value:
                  image: V2hhdCdzIHVwIHRoaXMgaXMgbXkgYmFzZTY0IGVuY29kZWQgc2hpdA==
                  odometer:
                    unit: km
                    value: 100
              image_with_fuel_and_odometer:
                summary: Signature with fuel and odometer
                value:
                  image: V2hhdCdzIHVwIHRoaXMgaXMgbXkgYmFzZTY0IGVuY29kZWQgc2hpdA==
                  fuel_percentage: 75.5
                  odometer:
                    unit: km
                    value: 12345.6
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /contracts/sales_lead:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Fetch sales lead form details by token
      description: 'Returns prefilled customer and reservation details for the unauthenticated sales lead form.

        The token must be valid and unexpired.'
      operationId: getContractsSalesLead
      tags:
      - Contracts
      security: []
      parameters:
      - name: token
        in: query
        required: true
        description: One-time token used to load the sales lead form
        schema:
          type: string
          example: ba4cefeb-d247-497b-b93c-a5f30d8c6f34
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Alex Morgan
                  phone_number:
                    type: string
                    example: '+15125551234'
                  email:
                    type: string
                    example: alex@example.com
                  customer_vehicle:
                    type:
                    - string
                    - 'null'
                    example: 2C4RC1BG5KR000001
        '404':
          description: Token is invalid, expired, or already used
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 30003
                  message:
                    type: string
                    example: This form has already been submitted, or your access token has expired
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      summary: Submit sales lead purchase intent
      description: 'Creates or updates a service-to-sales lead for the reservation identified by the token.

        On success, the token is consumed and cannot be reused.'
      operationId: postContractsSalesLead
      tags:
      - Contracts
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - purchase_intent
              properties:
                token:
                  type: string
                  example: ba4cefeb-d247-497b-b93c-a5f30d8c6f34
                purchase_intent:
                  type: string
                  enum:
                  - buying_now
                  - buying_soon
                  - just_exploring
                  description: Purchase intent selected by the customer
                  example: buying_now
            examples:
              buying_now:
                summary: Submit buying now intent
                value:
                  token: ba4cefeb-d247-497b-b93c-a5f30d8c6f34
                  purchase_intent: buying_now
      responses:
        '201':
          description: Created
        '404':
          description: Token is invalid, expired, or already used
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 30003
                  message:
                    type: string
                    example: This form has already been submitted, or your access token has expired
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    AdminCustomerContractResponse:
      type: object
      required:
      - id
      - token
      - status
      - scheduled_pickup_at
      - scheduled_dropoff_at
      - actual_pickup_at
      - actual_dropoff_at
      - balance
      - confirmation_token
      - purchase_order
      properties:
        id:
          type: integer
          example: 42
          description: database id of the contract
        token:
          type: string
          example: 7713738FG3
          description: token used to identify the contract in Dashboard routes
        actual_pickup_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2021-01-14T20:00:00Z'
          description: Time vehicle was actually picked up at
        actual_dropoff_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2021-01-17T15:00:00Z'
          description: Time vehicle was actually dropped off at
        balance:
          type: string
          example: $254.00
          description: Amount due on contract
        confirmation_token:
          type: string
          example: 7713738FG3
          description: also referred to as contract id
        status:
          type: string
          enum:
          - booked
          - cancelled
          - pending_agreement
          - started
          - finished
          - no_showed
        scheduled_pickup_at:
          type: string
          format: date-time
          example: '2021-01-14T20:00:00Z'
        scheduled_dropoff_at:
          type: string
          format: date-time
          example: '2021-01-17T15:00:00Z'
        purchase_order:
          type:
          - string
          - 'null'
          example: PO123
          description: The optional purchase order number associated with this contract
    AdminContractSplitBillRequest:
      type: object
      required:
      - name
      properties:
        reference_number:
          type: string
          description: Optional field for tracking number
          example: Claim 1234
        name:
          type: string
          description: Name of additional payer
          example: Insurance Company
        contact_name:
          type: string
          description: Name of a contact
          example: Claims Department
        line1:
          type: string
          description: First line of an address
          example: 123 W St
        line2:
          type: string
          description: Second line of an address
          example: 456 W St
        city:
          type: string
          description: City of an address
          example: Austin
        postal_code:
          type: string
          description: Postal code of an address
          example: '78701'
        subregion:
          type: string
          description: Subregion of an address
          example: TX
        phone_number:
          type: string
          description: Phone number of a contact
          example: '15551237890'
        email:
          type: string
          description: Email of a contact
          example: aaa@bbb.com
        fleet_id:
          type: number
          format: integer
          example: 42
    AdminVehicleSortColumns:
      type: string
      enum:
      - created_at
      - updated_at
      - license
      - model
      - odometer
      - physical_location
      - status
      - stock_number
      - year
      - vin
      - maturity_date
      - in_service_date
      - rdr_date
    SignatureRequest:
      type: object
      required:
      - image
      properties:
        image:
          type: string
          description: Base64-encoded signature image.
          example: V2hhdCdzIHVwIHRoaXMgaXMgbXkgYmFzZTY0IGVuY29kZWQgc2hpdA==
        fuel_percentage:
          type: number
          format: float
          example: 75.5
          description: Optional fuel percentage for lazy contactless cache creation.
        odometer:
          type: object
          description: Optional odometer for lazy contactless cache creation.
          required:
          - value
          - unit
          properties:
            value:
              type: number
              format: float
              example: 12345.6
            unit:
              type: string
              example: km
    AdminAgreementToggleResponse:
      type: object
      properties:
        id:
          type: integer
          example: 123
        active:
          type:
          - boolean
          - 'null'
          example: true
          description: Only present on Managed Toggles
        text:
          type: string
          example: I agree to receive my contract and receipt communications via SMS
          description: The text of the toggle
        numeric_order:
          type: integer
          example: 1
          description: 0 indexed position index for the toggle to print on contracts
        language:
          type: string
          example: en
          description: The main language of the agreement
        style:
          type:
          - string
          - 'null'
          example: bold
          description: Only present on Agreement Toggles (non-Managed toggles)
        translations:
          type: string
          example: '[{"language": "fr", "text": "French version of the text"}]'
          description: this is text based attribute but will work as JSON format to handle sub-languages like fr
        read_only:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2020-06-15T20:22:26Z'
        updated_at:
          type: string
          format: date-time
          example: '2020-06-15T20:22:26Z'
    AdminContractsWarranty:
      type: object
      properties:
        daily_rate:
          type: number
          example: 100.25
        warranty_days:
          type: number
          example: 4
        tax_percentage:
          type: number
          example: 0.08
        authorization_number:
          type: string
          example: ABC123
    AdminContractCustomerResponse:
      type: object
      properties:
        id:
          type: integer
          description: Customer ID
          example: 42
        first_name:
          type: string
          description: First name
          example: Leslie
        last_name:
          type: string
          description: Last name
          example: Knope
        phone_number:
          type: string
          description: Customer phone number, stripped to digits only
          example: '15554447275'
        email:
          type: string
          description: Customer email
          example: leslie.knope@parks.test
        links:
          properties:
            contract:
              $ref: '#/components/schemas/HypermediaLink'
    AdminCalendarContractResponse:
      type: object
      properties:
        id:
          type: number
          example: 1
        contract_type:
          type: string
          example: contract
          description: This is either a contract or reservation
        status:
          type: string
          example: booked
          description: booked, cancelled, pending_agreement, started, finished or no_showed
        created_at:
          type: string
          example: '2022-11-15T12:01:40-05:00'
        scheduled_pickup_at:
          type: string
          example: '2022-11-15T12:01:40-05:00'
        scheduled_dropoff_at:
          type: string
          example: '2022-11-15T12:01:40-05:00'
        actual_pickup_at:
          type:
          - string
          - 'null'
          example: '2022-11-15T12:01:40-05:00'
        actual_dropoff_at:
          type:
          - string
          - 'null'
          example: '2022-11-15T12:01:40-05:00'
        service_advisor:
          type:
          - string
          - 'null'
          example: Ted Smith
        vehicle_id:
          type:
          - number
          - 'null'
          example: 1
        fleet_id:
          type: number
          example: 2
        calendar_group:
          type: string
          example: unscheduled
          description: Either scheduled or unscheduled
        has_valet_task:
          type: boolean
          example: true
          description: true if the Contract has at least one valet task
        task_ids:
          type: array
          items:
            type: number
          example:
          - 1
          - 2
        service_vehicle_id:
          type:
          - string
          - 'null'
          example: 123abc
        repair_order:
          type:
          - string
          - 'null'
          example: abc123
        purchase_order:
          type:
          - string
          - 'null'
          example: PO123
          description: The optional purchase order number associated with this contract
        booking_application:
          type:
          - string
          - 'null'
          example: scheduler
          description: Client application type that created the reservation (e.g. web, iphone-appstore, scheduler).
        booking_channel:
          type:
          - string
          - 'null'
          example: mykaarma
          description: Partner integration source for the booking (e.g. mykaarma, xtime, redcap, toyota-oneapp) or dealerware for Dealerware-native bookings.
        agreement:
          $ref: '#/components/schemas/AdminCalendarAgreementResponse'
        customer:
          $ref: '#/components/schemas/AdminCalendarCustomerResponse'
    AdminContractUpdateRequest:
      type: object
      required:
      - scheduled_pickup_at
      - scheduled_dropoff_at
      properties:
        daily_rate_override:
          description: The daily rate to charge for this contract, if different from the default rate for the vehicle. Must have the accounting and/or admin role to set this field.
          type:
          - number
          - 'null'
          example: 29.95
        fleet_id:
          type: number
          example: 20
        purchase_order:
          type: string
          example: PO123
        repair_order:
          type: string
          example: ABC123
        scheduled_pickup_at:
          type: string
          format: date-time
          example: '2029-06-15T20:22:26Z'
        scheduled_dropoff_at:
          type: string
          format: date-time
          example: '2029-06-15T20:22:26Z'
        service_vehicle_id:
          type: string
          description: only allows numbers and lowercase letters
          example: 123abc
        service_advisor_id:
          type: number
          example: 1
        vehicle_id:
          type:
          - number
          - 'null'
          example: 42
    HypermediaLink:
      type: object
      properties:
        id:
          type: integer
          example: 2
          description: ID of the associated resource
        href:
          type: string
          example: https://api.dw-tst.com/admin/some_resources/2
          description: Link to the associated resource
    AdminDealershipContractResponse:
      type: object
      required:
      - id
      - actual_dropoff_at
      - actual_pickup_at
      - booked_by_name
      - booked_car_detailed_description
      - booking_application
      - booking_channel
      - capabilities
      - confirmation_token
      - contactless
      - created_at
      - credit_card_id
      - customer
      - daily_rate_override
      - damage_inspections
      - external_deposit_amount
      - finished_by_name
      - fuel
      - ineligibility_reasons
      - is_contract_eligible
      - links
      - location_sequence
      - max_vehicle_swaps
      - odometer
      - program_minimum_age
      - purchase_order
      - repair_order
      - scheduled_dropoff_at
      - scheduled_pickup_at
      - service_advisor_id
      - service_advisor_name
      - service_vehicle_id
      - signed
      - status
      - updated_at
      - vehicle_swaps_performed
      properties:
        id:
          type: integer
          example: 42
          description: database id of the contract
        actual_pickup_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-01-14T20:00:00Z'
        actual_dropoff_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-01-16T20:00:00Z'
        booked_car_detailed_description:
          type: object
          properties:
            acriss_code:
              type: string
              example: LCAR
            acriss_model_description:
              type: string
              example: Luxy 2/4 Door Automatic with AC
            city_mpg:
              type: string
              example: '21'
            fuel_tank:
              type: string
              example: '17.4'
            hwy_mpg:
              type: string
              example: '32'
            luggage:
              type: string
              example: 2-3
            make:
              type: string
              example: Lexus
            model:
              type: string
              example: IS
            passengers:
              type: string
              example: '5'
            style:
              type: string
              example: '300'
            type:
              type: string
              example: Sedan
            year:
              type: string
              example: '2020'
        booked_by_name:
          type:
          - string
          - 'null'
          example: Alexton McAnderson
        booking_application:
          type:
          - string
          - 'null'
          example: web
          description: Client application type that created the reservation (e.g. web, iphone-appstore, scheduler).
        booking_channel:
          type:
          - string
          - 'null'
          example: mykaarma
          description: Partner integration source for the booking (e.g. mykaarma, xtime, redcap, toyota-oneapp) or dealerware for Dealerware-native bookings.
        capabilities:
          type: object
          required:
          - payments
          - valet_moves
          properties:
            payments:
              type: object
              required:
              - on_platform
              - off_platform
              properties:
                on_platform:
                  type: boolean
                  example: true
                  description: Whether the contract allows on-platform payments.
                off_platform:
                  type: boolean
                  example: false
                  description: Whether the contract allows off-platform payments.
            valet_moves:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
                  example: true
                  description: Whether the contract dealership supports HopDrive Valet Moves controls.
        confirmation_token:
          type: string
          example: 7713738FG3
          description: also referred to as contract id
        contactless:
          type: boolean
          example: false
          description: denotes whether or not the contract is a contactless contract
        credit_card_id:
          type:
          - integer
          - 'null'
          example: 42
          description: ID of the credit card selected on the contract, or null when no card is selected.
        customer:
          type: object
          description: Customer summary. A missing or soft-deleted customer results in a 404 response.
          required:
          - id
          - full_name
          - has_complete_profile
          - permitted_to_rent
          properties:
            id:
              type: integer
              example: 42
            full_name:
              type: string
              example: Test Customer
              description: Customer name, masked as Deleted Customer for privacy-deleted customers.
            has_complete_profile:
              type: boolean
              example: false
            permitted_to_rent:
              type: boolean
              example: true
              description: Whether the customer is permitted to rent based on the active Do Not Rent list.
        created_at:
          type: string
          format: date-time
          example: '2021-01-15T19:38:26Z'
        daily_rate_override:
          description: The daily rate to charge for this contract, if different from the default rate for the vehicle
          type: number
          example: 29.95
        damage_inspections:
          type: array
          description: Damage inspection statuses for the active car reservations on this contract.
          items:
            type: object
            required:
            - vehicle_id
            - status
            - pdf_report_url
            properties:
              vehicle_id:
                type: integer
                example: 42
                description: The vehicle ID for the associated car reservation.
              status:
                type: string
                example: report_generated
                description: 'The status of the associated damage inspection. Returns `not_inspected`

                  when no damage inspection exists for that car reservation.

                  '
              pdf_report_url:
                type:
                - string
                - 'null'
                format: uri
                example: https://api.dealerware.com/rails/active_storage/blobs/redirect/abc123/report.pdf
                description: 'The URL for the attached damage inspection PDF report, if present.

                  Returns `null` when no PDF report has been attached for that car reservation.

                  '
        external_deposit_amount:
          type:
          - number
          - 'null'
          example: 100
          description: The amount of the external deposit, if any, that was collected for this contract
        finished_by_name:
          type:
          - string
          - 'null'
          example: J. Last
        fuel:
          type: object
          properties:
            starting_fuel_gallons:
              type:
              - number
              - 'null'
              example: 10.5
              description: Fuel amount at the start of the contract in gallons
            starting_fuel_liters:
              type:
              - number
              - 'null'
              example: 39.7
              description: Fuel amount at the start of the contract in liters
            ending_fuel_gallons:
              type:
              - number
              - 'null'
              example: 8.2
              description: Fuel amount at the end of the contract in gallons
            ending_fuel_liters:
              type:
              - number
              - 'null'
              example: 31
              description: Fuel amount at the end of the contract in liters
            starting_fuel_percentage:
              type:
              - number
              - 'null'
              format: float
              example: 75
              description: Starting fuel as a percentage of the tank capacity
            ending_fuel_percentage:
              type:
