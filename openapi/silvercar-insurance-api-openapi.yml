openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Insurance API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Insurance
paths:
  /admin/customers/{customer_id}/insurance:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Return the current active insurance the customer has
      operationId: getAdminCustomerInsurance
      tags:
      - Insurance
      parameters:
      - name: customer_id
        in: path
        description: The id of the customer
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCustomerInsuranceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    post:
      summary: Create a insurance for a customer
      operationId: postAdminCustomerInsurance
      tags:
      - Insurance
      parameters:
      - name: customer_id
        in: path
        required: true
        description: the customer ID
        schema:
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - expires_on
              properties:
                carrier:
                  type: string
                  example: UnitedHealthCare
                policy_number:
                  type: string
                  example: GAC56232
                expires_on:
                  type: string
                  example: '2023-02-13T16:08:34Z'
                image:
                  type: string
                  format: binary
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      summary: Update insurance for a customer
      operationId: updateAdminCustomerInsurance
      tags:
      - Insurance
      parameters:
      - name: customer_id
        in: path
        required: true
        description: the customer ID
        schema:
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - expires_on
              properties:
                carrier:
                  type: string
                  example: UnitedHealthCare
                policy_number:
                  type: string
                  example: GAC56232
                expires_on:
                  type: string
                  example: '2023-02-13T16:08:34Z'
                image:
                  type: string
                  format: binary
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  responses:
    NoContent:
      description: No Content
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Accepted media types is limited to JSON (application/json)
              code:
                type: integer
                example: 6789
    Created:
      description: Created
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: The request has been fulfilled and has resulted in a new resource being created
    UnprocessableEntity:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid resource id
              code:
                type: integer
                example: 6789
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource with id :id not found
              code:
                type: integer
                example: 6789
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid authorization token
              code:
                type: integer
                example: 6789
    NotAcceptable:
      description: Not Acceptable
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Missing headers in request
              code:
                type: integer
                example: 6789
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Request is forbidden
              code:
                type: integer
                example: 6789
  schemas:
    InsuranceSufficiencyRentalProperties:
      type:
      - object
      - 'null'
      properties:
        sufficient:
          type: boolean
          example: true
          description: Represents if the insurance document is sufficient
        status:
          type: string
          example: pass
          description: Status of the insurance document sufficiency
        valid_until:
          type: string
          example: '2024-12-31T23:59:59Z'
          description: Timestamp of when the insurance document sufficiency is valid until
        checked_at:
          type: string
          example: '2024-01-01T12:00:00Z'
          description: Timestamp of when the insurance document sufficiency was last checked
        details:
          type: object
          description: Additional details about the insurance document sufficiency provided by 3rd party
          properties:
            comprehensive_coverage_meets_requirements:
              type: string
              example: fail
            expiration_date_comparison:
              type: string
              example: pass
            insureds_match:
              type: string
              example: unknown
            rental_covered_for_collision:
              type: string
              example: pass
            required_policy_information_is_present:
              type: string
              example: pass
    InsuranceSufficiencyLoanerProperties:
      type:
      - object
      - 'null'
      properties:
        sufficient:
          type: boolean
          example: true
          description: Represents if the insurance document is sufficient
        status:
          type: string
          example: pass
          description: Status of the insurance document sufficiency
        valid_until:
          type: string
          example: '2024-12-31T23:59:59Z'
          description: Timestamp of when the insurance document sufficiency is valid until
        checked_at:
          type: string
          example: '2024-01-01T12:00:00Z'
          description: Timestamp of when the insurance document sufficiency was last checked
        details:
          type: object
          description: Additional details about the insurance document sufficiency provided by 3rd party
          properties:
            collision_coverage_meets_requirements:
              type: string
              example: pass
            comprehensive_coverage_meets_requirements:
              type: string
              example: fail
            expiration_date_comparison:
              type: string
              example: pass
            insureds_match:
              type: string
              example: unknown
            required_policy_information_is_present:
              type: string
              example: pass
    AdminCustomerInsuranceResponse:
      type: object
      properties:
        id:
          type: integer
          example: 12
        carrier:
          type:
          - string
          - 'null'
          example: UnitedHealthCare
        policy_number:
          type:
          - string
          - 'null'
          example: GAC56232
        expires_on:
          type: string
          example: '2023-02-13T16:08:34Z'
        customer_id:
          type: integer
          example: 110
        is_stale:
          type: boolean
          example: false
          description: Represents if the insurance account has not been refreshed since a time period determined by business rules
        is_verified:
          type: boolean
          example: false
          description: Represents if the insurance account is verified according to business rules
        is_incomplete:
          type: boolean
          example: false
          description: Indicates if the insurance record is missing required fields (carrier, policy_number, or expires_on)
        missing_required_fields:
          type: array
          items:
            type: string
            enum:
            - carrier
            - policy_number
            - expires_on
          example: []
          description: List of required fields that are missing from the insurance record
        refreshed_at:
          type:
          - string
          - 'null'
          example: '2023-02-13T16:08:34Z'
          description: Timestamp of when the last time the account was verified by the third party.
        insurance_verification_method:
          type:
          - string
          - 'null'
          example: manual
          description: 'Axle Ignition completion type for how insurance data was obtained (for example link, manual, proxy, or basic).

            '
        insurance_verification_detail:
          type:
          - string
          - 'null'
          example: document-ai-declarations-page
          description: 'Axle Ignition completion detail identifying the specific process used (for example user-portal-login, document-ai-declarations-page, or document-ai-id-card).

            '
        image:
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
              example: 323
            url:
              type: string
              example: https://example.com/image_url.png
        sufficiency:
          type:
          - object
          - 'null'
          properties:
            loaner:
              $ref: '#/components/schemas/InsuranceSufficiencyLoanerProperties'
            rental:
              $ref: '#/components/schemas/InsuranceSufficiencyRentalProperties'
  securitySchemes:
    Auth0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://dealerware.auth0.com/oauth/token
          scopes: {}
