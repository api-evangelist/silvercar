openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Drivers API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Drivers
  description: Driver actions and resources
paths:
  /admin/contracts/{id}/drivers:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get all Drivers attached to a given Contract
      operationId: getAdminContractsDrivers
      tags:
      - Drivers
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the contract
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDriversResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    post:
      summary: Create a Driver attached to a given Contract
      operationId: postAdminContractsDrivers
      tags:
      - Drivers
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the contract
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDriversRequest'
      responses:
        '201':
          description: Success
          headers:
            Location:
              schema:
                type: string
                description: Link location of created contract additional drivers
                example: https://api.dw-tst.com/admin/drivers/12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/drivers/{id}:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get a Driver's details
      operationId: getAdminDriver
      tags:
      - Drivers
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the Driver
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDriversResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
    put:
      summary: Update a Driver's details
      operationId: putAdminDriver
      tags:
      - Drivers
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the Driver
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDriversRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: Delete a Driver
      operationId: deleteAdminDriver
      tags:
      - Drivers
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the driver
        schema:
          type: integer
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/drivers/{id}/signature:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    post:
      summary: Create a Signature Image for the Driver
      operationId: postDriverSignature
      tags:
      - Drivers
      parameters:
      - name: id
        in: path
        required: true
        description: The driver's ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  description: Driver Signature Base64 Image
                  type: string
                  format: base64
                  example: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  responses:
    NoContent:
      description: No Content
    UnsupportedMediaType:
      description: Unsupported Media Type
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Accepted media types is limited to JSON (application/json)
              code:
                type: integer
                example: 6789
    Success:
      description: Success
    UnprocessableEntity:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid resource id
              code:
                type: integer
                example: 6789
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource with id :id not found
              code:
                type: integer
                example: 6789
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid authorization token
              code:
                type: integer
                example: 6789
    NotAcceptable:
      description: Not Acceptable
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Missing headers in request
              code:
                type: integer
                example: 6789
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Request is forbidden
              code:
                type: integer
                example: 6789
  schemas:
    HypermediaLink:
      type: object
      properties:
        id:
          type: integer
          example: 2
          description: ID of the associated resource
        href:
          type: string
          example: https://api.dw-tst.com/admin/some_resources/2
          description: Link to the associated resource
    AdminDriversRequest:
      type: object
      required:
      - born_on
      - country
      - first_name
      - last_name
      - license_expires_on
      - license_number
      - license_subregion
      - phone_number
      properties:
        email:
          type: string
          example: hulk.hogan@gmail.com
          description: Email
        first_name:
          type: string
          example: Hulk
          description: First Name
        last_name:
          type: string
          example: Hogan
          description: Last Name
        license_number:
          type: string
          example: 99887766
          description: The drivers license number
        license_subregion:
          type: string
          example: TX
          description: The subregion of the drivers license
        born_on:
          type: string
          example: '1993-04-19'
          description: The date of birth formatted like YYYY-MM-DD
        license_expires_on:
          type: string
          example: '2018-08-20'
          description: The expiration date formatted like YYYY-MM-DD
        country:
          type: string
          example: US
          description: The country of the drivers license
        phone_number:
          type: string
          example: 5124592222
          description: The additional drivers' phone number unformatted
    AdminDriversResponse:
      type: object
      properties:
        id:
          type: integer
          description: Additional Driver ID
          example: 22
        email:
          type: string
          description: Email
          example: hulk.hogan@gmail.com
        first_name:
          type: string
          description: First name
          example: Hulk
        last_name:
          type: string
          description: Last name
          example: Hogan
        license_number:
          type: string
          description: The drivers license number
          example: 99887766
        license_subregion:
          type: string
          description: The subregion of the drivers license
          example: TX
        license_expires_on:
          type: string
          description: The expiration date of the drivers license formatted like YYYY-MM-DD
          example: '2020-06-06'
        born_on:
          type: string
          description: The date of birth formatted like YYYY-MM-DD
          example: '1989-04-19'
        country:
          type: string
          description: The country of the drivers license
          example: US
        phone_number:
          type: string
          description: The phone number unformatted
          example: 5124592222
        signature:
          type: boolean
          description: Has a signature image by signing their agreement
          example: true
        links:
          type: object
          properties:
            contract:
              $ref: '#/components/schemas/HypermediaLink'
  securitySchemes:
    Auth0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://dealerware.auth0.com/oauth/token
          scopes: {}
