openapi: 3.2.0
info:
  contact:
    email: support@dealerware.com
    name: Dealerware Support
    url: https://support.dealerware.com
  description: MOB-API
  termsOfService: support@dealerware.com
  title: MOB Reservations API
  version: 1.0.0
servers:
- url: https://api.dealerware.com
  description: Production server
- url: https://api.dw-tst.com
  description: Staging server
security:
- Auth0: []
tags:
- name: Reservations
paths:
  /dealerships/{dealership_id}/reservations/{reservation_id}/customer:
    parameters:
    - name: api-version
      in: header
      description: Target API version
      required: true
      schema:
        type: integer
        example: 4
    get:
      summary: Get the customer information for a reservation
      operationId: getReservationCustomer
      tags:
      - Reservations
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: the Dealership ID
        schema:
          type: integer
      - name: reservation_id
        in: path
        required: true
        description: the Reservation ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationCustomerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update the customer information for a reservation
      operationId: putReservationCustomer
      tags:
      - Reservations
      parameters:
      - name: dealership_id
        in: path
        required: true
        description: the Dealership ID
        schema:
          type: integer
      - name: reservation_id
        in: path
        required: true
        description: the Reservation ID
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCustomerUpdateRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  responses:
    NoContent:
      description: No Content
    UnprocessableEntity:
      description: Unprocessable Content
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid resource id
              code:
                type: integer
                example: 6789
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource with id :id not found
              code:
                type: integer
                example: 6789
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Bad Request
              code:
                type: integer
                example: 6789
    NotAcceptable:
      description: Not Acceptable
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Missing headers in request
              code:
                type: integer
                example: 6789
  schemas:
    ReservationCustomerResponse:
      type: object
      properties:
        billing:
          type: object
          properties:
            card_type:
              type: string
            last_four:
              type: string
            expiration_month:
              type: string
            expiration_year:
              type: string
        current_state:
          type: string
          example: started
        customer:
          type: object
          properties:
            id:
              type: integer
              example: 1
            email:
              type: string
              example: customer@example.com
            first_name:
              type: string
              example: Harry
              description: Customer first name
            last_name:
              type: string
              example: Potter
              description: Customer last name
            phone_number:
              type: string
              example: 1234567890
              description: Customer phone number
            language:
              type: string
              example: English
              description: Customer language
            deleted:
              type: boolean
              description: has this account been deleted
        drivers_license:
          type: object
          properties:
            id:
              type: integer
              example: 2
            number:
              type: string
              example: TX12332
            state:
              type: string
              example: TX
            country:
              type: string
              example: US
            date_of_birth:
              type: string
              format: date
              example: '1979-03-03'
            expiration:
              type: string
              format: date
              example: '2040-03-03'
            name:
              type: string
              example: Harry Potter
            line1:
              type: string
              example: 2415 Highway 71 East
            line2:
              type: string
              example: Suite 761
            city:
              type: string
              example: Del Valle
            zip:
              type: string
              example: 90210
        insurance_expires_on:
          type: string
          format: datetime
          example: '2030-01-01'
          description: Policy expiration date
        sufficiency:
          type:
          - object
          - 'null'
          properties:
            loaner:
              $ref: '#/components/schemas/InsuranceSufficiencyLoanerProperties'
            rental:
              $ref: '#/components/schemas/InsuranceSufficiencyRentalProperties'
    InsuranceSufficiencyRentalProperties:
      type:
      - object
      - 'null'
      properties:
        sufficient:
          type: boolean
          example: true
          description: Represents if the insurance document is sufficient
        status:
          type: string
          example: pass
          description: Status of the insurance document sufficiency
        valid_until:
          type: string
          example: '2024-12-31T23:59:59Z'
          description: Timestamp of when the insurance document sufficiency is valid until
        checked_at:
          type: string
          example: '2024-01-01T12:00:00Z'
          description: Timestamp of when the insurance document sufficiency was last checked
        details:
          type: object
          description: Additional details about the insurance document sufficiency provided by 3rd party
          properties:
            comprehensive_coverage_meets_requirements:
              type: string
              example: fail
            expiration_date_comparison:
              type: string
              example: pass
            insureds_match:
              type: string
              example: unknown
            rental_covered_for_collision:
              type: string
              example: pass
            required_policy_information_is_present:
              type: string
              example: pass
    InsuranceSufficiencyLoanerProperties:
      type:
      - object
      - 'null'
      properties:
        sufficient:
          type: boolean
          example: true
          description: Represents if the insurance document is sufficient
        status:
          type: string
          example: pass
          description: Status of the insurance document sufficiency
        valid_until:
          type: string
          example: '2024-12-31T23:59:59Z'
          description: Timestamp of when the insurance document sufficiency is valid until
        checked_at:
          type: string
          example: '2024-01-01T12:00:00Z'
          description: Timestamp of when the insurance document sufficiency was last checked
        details:
          type: object
          description: Additional details about the insurance document sufficiency provided by 3rd party
          properties:
            collision_coverage_meets_requirements:
              type: string
              example: pass
            comprehensive_coverage_meets_requirements:
              type: string
              example: fail
            expiration_date_comparison:
              type: string
              example: pass
            insureds_match:
              type: string
              example: unknown
            required_policy_information_is_present:
              type: string
              example: pass
    ReservationCustomerUpdateRequest:
      type: object
      required:
      - first_name
      - last_name
      - phone_number
      - language
      properties:
        first_name:
          type: string
          example: Roonil
          description: Customer first name
        last_name:
          type: string
          example: Wazlib
          description: Customer last name
        email:
          type: string
          example: harry@hogwarts.gov.uk
          description: Customer email - required if dealership has email set as its notification method in its location settings
        phone_number:
          type: string
          example: 1234567890
          description: Phone number
        language:
          type: string
          example: English
          description: Customer language
  securitySchemes:
    Auth0:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://dealerware.auth0.com/oauth/token
          scopes: {}
